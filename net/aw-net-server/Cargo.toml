[package]
name = "aw-net-server"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
tokio-tungstenite = "0.28"
tungstenite = "0.28"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["macros"] }
sled = "0.34"
postcard = { version = "1", default-features = false, features = ["alloc"] }
lz4_flex = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
aw-net-proto = { path = "../aw-net-proto" }

[dev-dependencies]
# Caps the ready-socket test's send buffer so a pre-queued flood cannot
# leave thousands of frames for the handler to verify after the client drops.
socket2 = "0.6"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# TLS test-client plumbing for the family5 wss:// signature-path tests. Versions
# mirror the normal deps EXACTLY (tokio-rustls 0.26 / rustls 0.23) so there is no
# second rustls in the graph. rcgen generates an ephemeral self-signed cert at
# test time (the committed net/certs/dev/*.pem are placeholders, so the server's
# cert loader rejects them); its `ring` backend matches the server's rustls
# crypto provider. The wss:// client uses a permissive cert verifier (see the
# test), so the generated cert's SAN/CN is irrelevant — these tests validate the
# HMAC SIGNATURE path over TLS, not TLS certificate validation. Cert PEM is
# parsed with rustls-pki-types.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"