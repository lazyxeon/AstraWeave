[package]
name = "astraweave-physics"
version = "0.1.0"
license.workspace = true
edition = "2021"

[features]
default = []
async-physics = ["rayon"]
# Optional dep `serde` implies a feature of the same name. Extend it so
# telemetry export can format JSON.
serde = ["dep:serde", "dep:serde_json"]
profiling = ["astraweave-profiling/profiling", "tracy-client", "tracy-client/enable"]
ecs = ["astraweave-ecs", "astraweave-scene"]
# Pull in astraweave-profiling's alloc-counter for bench assertions. The dep is
# optional by default; this feature cascades `dep:astraweave-profiling` so the
# crate is only built when someone actually asks for counting. The bench-side
# global allocator installation uses a small ad-hoc wrapper (see
# `benches/alloc_measure.rs`) to avoid a runtime dep on astraweave-ecs.
alloc-counter = ["dep:astraweave-profiling", "astraweave-profiling/alloc-counter"]
# Bench-only: swap the inner allocator of the bench's BenchAlloc to MiMalloc.
# Does nothing to the library itself.
fast-alloc = ["dep:astraweave-alloc", "astraweave-alloc/fast-alloc"]

[dependencies]
anyhow = { workspace = true }
glam = { workspace = true }
libm = { version = "0.2", default-features = false }
rapier3d = { workspace = true, features = ["enhanced-determinism"] }
rand = { workspace = true }
bitflags = "2"
# Gameplay water-truth facade (F.2). Physics is the facade's first consumer:
# buoyancy queries WaterQuery instead of a private scalar plane. Dependency
# direction is physics → water (water is a glam-only leaf), keeping the
# physics→fluids→terrain→gameplay→physics cycle open.
astraweave-water = { path = "../astraweave-water" }
astraweave-destruction = { path = "../astraweave-destruction" }
libm = { version = "0.2", default-features = false }
rayon = { version = "1.10", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
astraweave-profiling = { path = "../astraweave-profiling", optional = true }
tracy-client = { version = "0.18", optional = true }
rustc-hash = "2.0"  # Phase B optimization: FxHashMap provides better performance (3.77ms vs 5.61ms with Tracy)
astraweave-ecs = { path = "../astraweave-ecs", optional = true }
astraweave-scene = { path = "../astraweave-scene", optional = true }
astraweave-alloc = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[[bench]]
name = "raycast"
harness = false

[[bench]]
name = "character_controller"
harness = false

[[bench]]
name = "rigid_body"
harness = false

[[bench]]
name = "physics_async"
harness = false
required-features = ["async-physics"]

[[bench]]
name = "cloth"
harness = false

[[bench]]
name = "vehicle"
harness = false

[[bench]]
name = "destruction"
harness = false

[[bench]]
name = "ragdoll"
harness = false

[[bench]]
name = "gravity"
harness = false

[[bench]]
name = "alloc_measure"
harness = false
required-features = ["alloc-counter"]

# Production-lib unwrap gate. Enforced by the single workspace clippy --lib pass.
# Tests are not part of --lib, so test unwraps stay allowed.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
result_large_err = "allow"
