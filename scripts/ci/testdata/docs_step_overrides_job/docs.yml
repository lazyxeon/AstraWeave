name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tmp
    steps:
      - name: Copy
        working-directory: docs
        run: cp -r archive/benchmark_dashboard book/dashboard/
