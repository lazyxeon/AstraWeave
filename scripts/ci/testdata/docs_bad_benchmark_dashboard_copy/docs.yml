name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy standalone dashboard
        run: |
          mkdir -p docs/book/dashboard/benchmark_dashboard
          cp -r docs/archive/benchmark_dashboard/* docs/book/dashboard/benchmark_dashboard/ 2>/dev/null || true