name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/archive/benchmark_dashboardEXTRA
          publish_branch: gh-pages
          destination_dir: ${{ 'dashboard-notes' }}
          keep_files: true
          force_orphan: false
      - name: Deploy notes
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          publish_branch: gh-pages
          destination_dir: dashboard/benchmark_dashboard_notes
          keep_files: true
          force_orphan: ' false '
      - name: Unresolved destination is not the dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          publish_branch: gh-pages
          destination_dir: ${{ github.ref_name }}
          keep_files: true
      - name: Unresolved publish dir is not the archive
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ github.ref_name }}
          keep_files: true
      - name: Book publish without a destination
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          keep_files: true
