name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy
        run: "a=docs/archive/benchmark_dashboard/index.html; cp $a docs/book/dashboard/benchmark_dashboard/index.html"
