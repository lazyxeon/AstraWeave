name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy
        run: |
          if true; then
            SRC=docs/archive/benchmark_dashboard/index.html
          fi
          SRC=harmless
          cp "$SRC" docs/book/dashboard/benchmark_dashboard/index.html
