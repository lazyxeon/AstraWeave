name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Not a copy
        run:
          - cp -r docs/archive/benchmark_dashboard docs/book/dash
          - board/benchmark_dashboard/index.html
