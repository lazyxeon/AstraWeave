name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy
        run: |
          SUB=docs/archive
          DIR=$SUB
          cd "$DIR"
          cp -r benchmark_dashboard ../book/dashboard/benchmark_dashboard
