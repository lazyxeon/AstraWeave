name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Other workspace directory
        working-directory: ${{ github.workspace }}/notes
        run: cp -r archive/benchmark_dashboard book/dashboard/benchmark_dashboard
      - name: Lowercase env is not the variable
        working-directory: $github_workspace/docs
        run: cp -r archive/benchmark_dashboard book/dashboard/benchmark_dashboard
      - name: Longer env name
        working-directory: $GITHUB_WORKSPACE_EXTRA/docs
        run: cp -r archive/benchmark_dashboard book/dashboard/benchmark_dashboard
      - name: Different context
        working-directory: ${{ github.workspace_extra }}/docs
        run: cp -r archive/benchmark_dashboard book/dashboard/benchmark_dashboard
