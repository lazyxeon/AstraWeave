name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}/docs
    steps:
      - name: Copy
        run: |
          cp -r archive/benchmark_dashboard book/dashboard/benchmark_dashboard
