name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare Dashboard Assets
        run: |
          mkdir -p gh-pages/benchmark-data
          if [ -f target/benchmark-data/history.jsonl ]; then
            cp target/benchmark-data/history.jsonl gh-pages/benchmark-data/
          else cp docs/archive/benchmark_dashboard/index.html docs/book/dashboard/benchmark_dashboard/index.html
          fi
