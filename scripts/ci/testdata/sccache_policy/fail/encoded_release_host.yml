name: fixture
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:

      - run: curl -fsSL https://github.com%2E/mozilla/sccache/releases/download/v0.20.0/sccache-v0.20.0-x86_64-unknown-linux-musl.tar.gz
