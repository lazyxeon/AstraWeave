name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy
        working-directory: docs/archive
        run: |
          FOO=1 set +e
          cd nope
          cp -r benchmark_dashboard ../book/dashboard/benchmark_dashboard
