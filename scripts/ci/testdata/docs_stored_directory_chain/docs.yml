name: Documentation

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy
        run: |
          A=docs/archive
          B=${A}
          C=$B
          cd "$C"
          cp -r benchmark_dashboard ../book/dashboard/benchmark_dashboard
