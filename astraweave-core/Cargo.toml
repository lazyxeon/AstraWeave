[package]
name = "astraweave-core"
version = "0.1.0"
edition = "2021"
license = { workspace = true }
publish = { workspace = true }

# Allow cfg(kani) for Kani formal verification
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
# Test-only. Turns on CountingAlloc for tests/zero_alloc_tick.rs.
# The test is ignored, so a default `cargo test` / PR nextest does not run it.
alloc-counter = ["astraweave-ecs/alloc-counter"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
glam = { workspace = true }
astraweave-ecs = { workspace = true }
astraweave-behavior = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
astraweave-ai = { workspace = true }
astraweave-destruction = { workspace = true }
astraweave-gameplay = { path = "../astraweave-gameplay" }
astraweave-math = { workspace = true }
astraweave-nav = { workspace = true }
astraweave-weaving = { path = "../astraweave-weaving" }
sha2 = { workspace = true }

[[bench]]
name = "core_benchmarks"
harness = false

[[bench]]
name = "full_game_loop"
harness = false

# Production-lib unwrap gate. Enforced by the single workspace clippy --lib pass.
# Tests are not part of --lib, so test unwraps stay allowed.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
result_large_err = "allow"
