# cargo-deny configuration for Veilweaver: Threads of Eternity
# This file is checked by the security-audit.yml workflow
# Updated for improved dependency management and security

[licenses]
# List of explicitly allowed licenses - updated for game engine needs
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause", 
    "BSD-2-Clause",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",  # Used by ICU4X crates
    "Unicode-DFS-2016",  # Used by Unicode normalization
    "OFL-1.1",  # SIL Open Font License (for fonts)
    "CDLA-Permissive-2.0",  # Community Data License Agreement - used by webpki-roots
    "BSL-1.0",  # Boost Software License 1.0 - used by clipboard-win and error-code
    "NCSA",     # University of Illinois/NCSA Open Source License - used by libfuzzer-sys
    "LicenseRef-UFL-1.0",  # Ubuntu Font License - used by epaint/egui fonts
    "Ubuntu-font-1.0",     # SPDX id used by newer egui font metadata
    "MIT-0",               # MIT No Attribution - borrow-or-share
    "bzip2-1.0.6",         # bzip2 crate
]

# The confidence threshold for detecting a license from a license text.
# 0.8 should be high enough to remove false positives
confidence-threshold = 0.8

[licenses.private]
# If true, ignores workspace crates that aren't published, or are only
# published to private registries
ignore = true

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "allow"
# The graph highlighting used when creating dotgraphs for crates
# with multiple versions
highlight = "all"

# List of crates to deny for security reasons
deny = [
    # Prefer rustls over OpenSSL for better security and cross-platform support
    { name = "openssl", version = "*" },
    { name = "openssl-sys", version = "*" },
    # Discourage use of insecure random number generators
    { name = "rand_core", version = "<0.6" },
]

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    # Skip known duplicates that are hard to avoid
    { name = "windows_x86_64_msvc", version = "*" },
    { name = "windows_x86_64_gnu", version = "*" },
]

# Similarly to `skip` allows you to skip certain crates from being checked. Unlike `skip`,
# `skip-tree` skips the crate and all of its dependencies.
skip-tree = [
    # Skip problematic dependency trees
]

# Allow external tools and build dependencies to have different rules
external-default-features = "allow"

[sources]
# Lint level for what to happen when a crate from a crate registry that is
# not in the allow list is encountered
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not
# in the allow list is encountered
unknown-git = "warn"

# List of allowed registries
allow-registry = [
    "https://github.com/rust-lang/crates.io-index"
]

# List of allowed Git repositories (for dependencies not yet on crates.io)
allow-git = [
    # Example: "https://github.com/rustwasm/wasm-bindgen",
]

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]

# The maximum number of days that can pass before failing CI due to stale advisory db
maximum-db-staleness = "P90D"

# cargo-deny 0.20: these fields are scopes ("all" / "workspace" / "transitive" / "none").
# Vulnerabilities always fail unless listed in `ignore`. "all" fails on an
# unmaintained or unsound advisory that is not ignored.
unmaintained = "all"
unsound = "all"
# bevy_platform 0.17.3 still depends on yanked spin 0.10.0. warn, don't fail.
yanked = "warn"

# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
ignore = [
    # paste 1.0.15 is unmaintained and has no successor release. nalgebra/simba
    # (pulled by rapier3d) and texture2ddecoder still depend on it.
    "RUSTSEC-2024-0436",
    # instant and fxhash are unmaintained transitive deps of sled 0.34
    # (aw-net-client / aw-net-server only). Not in the greybox graph.
    "RUSTSEC-2024-0384",
    "RUSTSEC-2025-0057",
    # bincode 1 and 2 are unmaintained with no patched release. Replacing them
    # changes on-disk formats in terrain, ai, and persistence-ecs.
    "RUSTSEC-2025-0141",
    # No patched release. Transitive or optional, not in the greybox graph.
    "RUSTSEC-2025-0119", # number_prefix
    "RUSTSEC-2025-0134", # rustls-pemfile, used by aw-net-server cert loading
    "RUSTSEC-2026-0249", # smartstring
    "RUSTSEC-2026-0192", # ttf-parser, via fonts
    "RUSTSEC-2024-0449", # unsafe-libyaml, via deprecated serde_yaml
    # nalgebra 0.26.2 Deserialize length invariant. Only mikktspace 0.3.0
    # (latest) pulls it, for tangent generation. That path does not
    # deserialize nalgebra. No newer mikktspace release exists.
    "RUSTSEC-2021-0070",
    # quick-xml <0.41. Pulled by wayland-scanner (winit) and zbus_xml
    # (accesskit), which parse protocol XML, not save files. No
    # semver-compatible upgrade inside winit 0.30 / accesskit_winit 0.27.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustls-webpki 0.102 via rustls 0.22 / tokio-rustls 0.25 in aw-net-server.
    # Not linked into aravath_greybox. Moving the server to tokio-rustls 0.26
    # changes the ServerCertVerifier trait the TLS tests implement.
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0049",
]

# Threshold for security vulnerabilities, any vulnerability with a CVSS score
# lower than this value will be ignored. Valid values are between 0.0 and 10.0.
# severity-threshold = 0.0

# If this is true, then cargo deny will use the git executable to fetch advisory database.
# If this is false, then it uses a built-in git library.
# Setting this to true can be helpful if you have special authentication requirements that the built-in git library does not support.
# Default value is false.
git-fetch-with-cli = true
