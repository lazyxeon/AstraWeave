[package]
name = "astraweave-net-ecs"
version = "0.1.0"
license.workspace = true
edition = "2021"
autobenches = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
futures-util = { workspace = true }
tokio-tungstenite = "0.28"
aw-net-proto = { path = "../net/aw-net-proto" }
astraweave-ecs = { workspace = true }
astraweave-core = { workspace = true }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
lz4_flex = "0.11"
crc32fast = "1.4"
glam = { workspace = true }
bincode = "2.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"

# One Criterion group per target. The runner gives each target 600s, and the
# combined net_ecs_benchmarks binary exceeded that on the 0758171b main run.
[[bench]]
name = "net_ecs_serialization"
harness = false

[[bench]]
name = "net_ecs_compression"
harness = false

[[bench]]
name = "net_ecs_delta"
harness = false

[[bench]]
name = "net_ecs_client_server"
harness = false

[[bench]]
name = "net_ecs_full_pipeline"
harness = false

[[bench]]
name = "net_ecs_bandwidth"
harness = false

[[bench]]
name = "net_ecs_adversarial"
harness = false