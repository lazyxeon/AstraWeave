[package]
name = "astraweave-localsim"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Deterministic local field: activation-mapped regions for fluid volume, gas, and heat. GPU fluids stay visual."

[dependencies]
astraweave-water = { path = "../astraweave-water" }
sha2 = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tick"
harness = false
