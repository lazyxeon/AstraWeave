# aw-net-client tests whose CARGO_BIN_EXE path is on the build machine).
[profile.ci-pr-archive]
inherits = "ci"
default-filter = """
not (
  (package(=astraweave-fluids) & binary(=gpu_execution_tests) & test(=gpu_render_accents_smoke))
