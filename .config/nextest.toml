# Selected with `cargo nextest run --profile ci`.
# Ordinary tests may retry twice. Determinism and replay tests never retry:
# a second pass would hide a hash mismatch.
[profile.ci]
retries = 2
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'test(/determinism/) | test(/replay/) | test(/deterministic/)'
retries = 0
slow-timeout = { period = "300s", terminate-after = 1 }

# Pull-request profile. Inherits retries and the determinism override.
# default-filter drops only the tests named in scripts/ci/deferred_pr_tests.txt
# (issue #254, owner PR #217). Nightly and main stay on profile ci, which has
# no default-filter, so those tests still run. Replay hashes are unaffected:
# determinism-replay.yml does not call nextest.
[profile.ci-pr]
inherits = "ci"
default-filter = """
not (
  (package(=astraweave-fluids) & binary(=gpu_execution_tests) & test(=gpu_render_accents_smoke))
  |   (package(=astraweave-fluids) & binary(=gpu_execution_tests) & test(=gpu_renderer_smoke))
  |   (package(=astraweave-fluids) & binary(=gpu_execution_tests) & test(=gpu_visible_state_advances_every_frame))
  |   (package(=astraweave-llm) & binary(=advanced_features_test) & test(=test_qwen3_variants))
  |   (package(=astraweave-render) & binary(=astraweave_render) & test(=god_rays::tests::god_ray_pass_creation))
  |   (package(=astraweave-render) & binary(=astraweave_render) & test(=gtao::tests::gtao_pass_creation))
  |   (package(=astraweave-render) & binary(=astraweave_render) & test(=gtao::tests::gtao_pass_resize))
  |   (package(=astraweave-render) & binary(=astraweave_render) & test(=renderer_tests::tests::test_renderer_water_initialization))
  |   (package(=astraweave-render) & binary(=astraweave_render) & test(=water::tests::test_water_renderer_new_and_update))
  |   (package(=astraweave-render) & binary(=coverage_booster_render) & test(=test_deferred_gbuffer_formats))
  |   (package(=astraweave-render) & binary(=coverage_booster_render) & test(=test_deferred_renderer_comprehensive))
  |   (package(=astraweave-render) & binary(=coverage_booster_render) & test(=test_deferred_renderer_more_coverage))
  |   (package(=astraweave-render) & binary(=coverage_booster_render) & test(=test_render_extra_systems))
  |   (package(=astraweave-render) & binary(=coverage_booster_render) & test(=test_renderer_full_pipeline))
  |   (package(=astraweave-render) & binary(=gpu_resource_leak_detection) & test(=test_buffer_lifecycle_no_leaks))
  |   (package(=astraweave-render) & binary(=gpu_resource_leak_detection) & test(=test_renderer_lifecycle_stress_test))
)
"""

# Windows partition runs. Same exclusions as ci-pr, plus the archive-only
