[package]
name = "astraweave-persona"
version = "0.1.0"
license.workspace = true
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
zip = { workspace = true }
astraweave-memory = { path = "../astraweave-memory" }
astraweave-core = { path = "../astraweave-core" }

# Phase 2 LLM Integration
astraweave-llm = { path = "../astraweave-llm" }
astraweave-embeddings = { path = "../astraweave-embeddings" }
astraweave-context = { path = "../astraweave-context" }
astraweave-prompts = { path = "../astraweave-prompts" }
astraweave-rag = { path = "../astraweave-rag" }

# Async runtime
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"

# Additional utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tempfile = "3.0"

[[bench]]
name = "persona_benchmarks"
harness = false

# P1 unwrap guidance. Warn, matching the old non-blocking P1 matrix.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
