[package]
name = "astraweave-audio"
version = "0.1.0"
license.workspace = true
edition = "2021"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
glam = { workspace = true }
rodio = { workspace = true }
astraweave-gameplay = { path = "../astraweave-gameplay" }

[features]
mock_tts = ["dep:hound"]

[dependencies.hound]
version = "3"
optional = true

[dev-dependencies]
hound = "3"
criterion = "0.5"
serial_test = "3.0"
tempfile = "3.0"

[[bench]]
name = "audio_benchmarks"
harness = false

# Production-lib unwrap gate. Enforced by the single workspace clippy --lib pass.
# Tests are not part of --lib, so test unwraps stay allowed.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
result_large_err = "allow"
