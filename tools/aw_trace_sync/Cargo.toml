[package]
name = "aw_trace_sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic trace -> registry/map synchronizer. Front-matter owns trace links, status, and runtime edges. cargo metadata owns the node set and normal path edges. --check gates the CLAUDE.md table and workspace_map.html."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
yaml_serde = "0.10"
cargo_metadata = "0.18"
# Same crate and version already locked by aw_doc_lint. GFM parse of headings and anchor tags.
pulldown-cmark = { version = "0.13.6", default-features = false }
# GitHub slugs keep \p{Word}. regex 1.12 is already locked by astraweave-dialogue.
regex = "1.12"

[dev-dependencies]
tempfile = "3"
