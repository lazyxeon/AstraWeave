[package]
name = "astraweave-embeddings"
version = "0.1.0"
edition = "2021"
description = "High-performance embeddings and vector search for AI-native gaming"
license = "MIT"
repository = "https://github.com/lazyxeon/AstraWeave"
autobenches = false

[dependencies]
# Core dependencies
astraweave-core = { path = "../astraweave-core" }
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Vector operations and indexing
nalgebra = "0.33"
rand = { version = "0.9", features = ["small_rng"] }

# ONNX Runtime for sentence transformers
# download-binaries pulls ureq's native-tls build-dep, which pulls the
# banned openssl crate. Callers supply the ONNX runtime library instead.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "tracing", "copy-dylibs", "load-dynamic", "cuda", "tensorrt"], optional = true }

# Alternative: candle for pure Rust inference
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }

# HNSW for approximate nearest neighbor search (optional)
hnsw_rs = { version = "0.3", optional = true }

# HTTP client for embeddings API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
astraweave-llm = { path = "../astraweave-llm", optional = true }

# Concurrent data structures
dashmap = "6.1"
parking_lot = "0.12"

[features]
default = ["hnsw"]
hnsw = ["hnsw_rs"]
http = ["reqwest", "dep:astraweave-llm", "astraweave-llm/ollama"]
onnx = ["ort"]
candle = ["candle-core", "candle-nn", "candle-transformers"]

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tokio-test = "0.4"

# embeddings_bench exceeded the 600s per-target cap on main 0758171b.
[[bench]]
name = "embeddings_client"
harness = false

[[bench]]
name = "embeddings_search"
harness = false

[[bench]]
name = "embeddings_text"
harness = false

[[bench]]
name = "embeddings_batch"
harness = false


# Production-lib unwrap gate. Enforced by the single workspace clippy --lib pass.
# Tests are not part of --lib, so test unwraps stay allowed.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
result_large_err = "allow"
