# Cross-OS replay hash for the sandboxed mod script system (WS-MOD).
# WS-D0 owns determinism-replay.yml. This workflow is the scripted_system case
# until that file absorbs it. A mismatch across OS fails the compare job.

name: Determinism Replay (mod scripts)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: determinism-replay-mod-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  hash:
    name: hash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Baseline CPU
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "${{ runner.os }}" = "macOS" ] && [ "$arch" = "arm64" ]; then
            echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          else
            echo "RUSTFLAGS=-C target-cpu=x86-64" >> "$GITHUB_ENV"
          fi

      - name: Scripted-system replay hash
        shell: bash
        run: cargo test -p astraweave-scripting --test script_replay_hash -- --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: script-replay-hash-${{ runner.os }}
          path: target/script-replay-hash.json
          if-no-files-found: error

  compare:
    name: compare
    runs-on: ubuntu-latest
    needs: hash
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: script-replay-hash-*
          path: hashes

      - name: Diff scripted_system across OS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          files = sorted(pathlib.Path("hashes").glob("*/script-replay-hash.json"))
          if len(files) != 3:
              sys.exit(f"expected 3 replay-hash artifacts, found {len(files)}: {files}")
          baseline = None
          for path in files:
              rows = json.loads(path.read_text())
              got = {row["case"]: row["sha256"] for row in rows}
              if "scripted_system" not in got:
                  sys.exit(f"{path} is missing scripted_system")
              print(f"{path.parent.name} scripted_system {got['scripted_system']}")
              if baseline is None:
                  baseline = got
              elif baseline != got:
                  sys.exit(f"mismatch\n{baseline}\nvs {path}: {got}")
          print("scripted_system matches across OS")
          PY
