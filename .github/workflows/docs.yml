name: Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.rs'
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.rs'
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      rebuild_reason:
        description: 'Optional note for why the Pages site is being rebuilt manually'
        required: false
        type: string
      skip_link_check:
        description: 'Skip the broken-link check for a faster manual rebuild'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MDBOOK_VERSION: '0.5.2'

jobs:
  build-and-deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mdBook (pre-built binary)
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          sum="084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/tool.tar.gz" "$url"
          echo "$sum  $tmp/tool.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/tool.tar.gz" -C "$tmp"
          sudo install -m 0755 "$tmp/mdbook" /usr/local/bin/mdbook
          mdbook --version

      - name: Install mdBook plugins
        run: |
          set -euo pipefail
          # book.toml requires the mermaid preprocessor.
          url="https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.0/mdbook-mermaid-v0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          sum="8aced70d781830fb0e81988f081c4abdd49e056a001ae2f1e4d484e1f6385c57"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/tool.tar.gz" "$url"
          echo "$sum  $tmp/tool.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/tool.tar.gz" -C "$tmp"
          sudo install -m 0755 "$tmp/mdbook-mermaid" /usr/local/bin/mdbook-mermaid
          mdbook-mermaid --version

      - name: Build mdBook documentation
        run: |
          set -euo pipefail
          cd docs
          mdbook build
          touch book/.nojekyll
          cp src/robots.txt book/robots.txt
          mkdir -p book/assets
          cp -r src/assets/. book/assets/

      - name: Copy standalone dashboard
        run: |
          set -euo pipefail
          mkdir -p docs/book/dashboard/benchmark_dashboard
          cp -r docs/archive/benchmark_dashboard/. docs/book/dashboard/benchmark_dashboard/

      - name: Copy workspace architecture map
        run: |
          mkdir -p docs/book/architecture
          cp docs/architecture/workspace_map.html docs/book/architecture/index.html
          echo "Workspace architecture map copied; URL slug /architecture/"

      - name: Install system dependencies (for cargo doc)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-astraweave
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build API documentation
        run: |
          set -euo pipefail
          cargo doc --no-deps \
            --package astraweave-core \
            --package astraweave-ai \
            --package astraweave-physics \
            --package astraweave-nav \
            --package astraweave-render \
            --package astraweave-ecs \
            --package astraweave-behavior \
            --package astraweave-llm \
            --package astraweave-gameplay \
            --package astraweave-terrain
          echo '<meta http-equiv="refresh" content="0; url=astraweave_core/index.html">' > target/doc/index.html
          mkdir -p docs/book/api
          cp -r target/doc/. docs/book/api/
          echo '<meta http-equiv="refresh" content="0; url=astraweave_core/index.html">' > docs/book/api/index.html

      - name: Generate sitemap
        run: bash docs/scripts/generate-sitemap.sh docs/book

      - name: Check for broken links
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_link_check) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://github.com/lycheeverse/lychee/releases/download/v0.15.1/lychee-v0.15.1-x86_64-unknown-linux-gnu.tar.gz"
          sum="9afdf0f48064fdcd8a8815ca6d2d9fcd43a0ef4c2edf9da23d6f7bf46a764eb8"
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/tool.tar.gz" "$url"
          echo "$sum  $tmp/tool.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/tool.tar.gz" -C "$tmp"
          install -m 0755 "$tmp/lychee" "$tmp/lychee-bin"
          status=0
          # docs/book/api is generated rustdoc. Its links point at dependency
          # docs.rs pages. The book pages are the check.
          # mdbook's edit-url-template links every page at GitHub's editor.
          # Crawling those editor URLs returns HTTP 429. They are not content
          # links. Every other link in the book is still checked.
          "$tmp/lychee-bin" "docs/book/**/*.html" \
            --exclude-path docs/book/api \
            --exclude localhost \
            --exclude 127.0.0.1 \
            --exclude "file://" \
            --exclude '^https://github.com/lazyxeon/AstraWeave/edit/' \
            --format markdown \
            --output link-report.md || status=$?
          if [ -f link-report.md ]; then
            echo "### Link Check Report" >> "$GITHUB_STEP_SUMMARY"
            cat link-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload link report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: link-report
          path: link-report.md
          retention-days: 7

      - name: Verify mdBook output
        run: |
          if [ ! -f docs/book/index.html ]; then
            echo "::error::docs/book/index.html not found — mdBook build failed"
            exit 1
          fi
          echo "mdBook output verified: $(find docs/book -name '*.html' | wc -l) HTML files"

      - name: Upload book
        uses: actions/upload-artifact@v7
        with:
          name: docs-book
          path: docs/book
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Documentation built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Link check uses the read-only token. Deploy is a separate job." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy Docs
    needs: build-and-deploy
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download book
        uses: actions/download-artifact@v8
        with:
          name: docs-book
          path: docs/book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'Deploy mdBook documentation: ${{ github.sha }}'

      - name: Summary
        run: |
          echo "### Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Documentation URL**: https://lazyxeon.github.io/AstraWeave/" >> $GITHUB_STEP_SUMMARY
          echo "**API Docs URL**: https://lazyxeon.github.io/AstraWeave/api/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Last Updated**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
