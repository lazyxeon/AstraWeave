# Required status check on pull requests: `determinism-replay / compare`.
# Branch protection is a repository setting. This workflow is the check it must require.
# `planner_pure` (WS-D0), `perception_world` (WS-D1), `gameplay_rng` (WS-D2),
# `fixed64`, `combat_resolve`, `destruction`, `gameplay_qa_aravath_slice`,
# `nav_reroute`, `causal_bridge`, `scripted_system` (WS-MOD), `weaving`,
# `traversal`, `traversal_deformed`, `worldgen_columns`, and `deformed_chunk`
# fail the compare job on any mismatch or if the case is missing. No path
# filter. cargo test has no retry loop (no-retry). Do not switch this job to
# nextest.

name: determinism-replay

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  hash:
    name: hash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          install-nextest: "false"

      - name: Pin baseline CPU
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          case "$host" in
            x86_64-*)
              echo "RUSTFLAGS=-C target-cpu=x86-64" >> "$GITHUB_ENV"
              ;;
            aarch64-*)
              echo "aarch64 uses the default baseline CPU (target-cpu=native is forbidden)."
              ;;
            *)
              echo "unsupported host $host" >&2
              exit 1
              ;;
          esac

      - name: Fetch Aravath nature models
        run: git lfs pull --include "assets/aravath/models/nature/*.glb"

      - name: Replay hash
        run: |
          cargo test -p astraweave-core --test replay_hash -- --nocapture
          cargo test -p astraweave-combat --test replay_hash -- --nocapture
          cargo test -p astraweave-weaving --lib gameplay_qa::tests::replay_aravath_slice_scenario -- --exact --nocapture
          cargo test -p astraweave-causality --test replay_hash -- --nocapture
          cargo test -p astraweave-scripting --test script_replay_hash -- --nocapture
          cargo test -p astraweave-physics --test traversal_replay -- --nocapture
          cargo test -p astraweave-terrain --test worldgen_hash -- --nocapture

      - name: Merge replay hashes
        run: |
          node <<'JS'
          const fs = require("fs");
          const path = require("path");
          const root = process.env.CARGO_TARGET_DIR || "target";
          const core = JSON.parse(fs.readFileSync(path.join(root, "replay-hash.json"), "utf8"));
          const combat = JSON.parse(fs.readFileSync(path.join(root, "replay-hash-combat.json"), "utf8"));
          const gameplay = JSON.parse(fs.readFileSync(path.join(root, "replay-hash-gameplay-qa.json"), "utf8"));
          const causal = JSON.parse(fs.readFileSync(path.join(root, "replay-hash-causal.json"), "utf8"));
          const traversal = JSON.parse(fs.readFileSync(path.join(root, "replay-hash-traversal.json"), "utf8"));
          const seen = new Set(core.map((row) => row.case));
          const merged = core.slice();
          for (const row of combat.concat(gameplay, causal, traversal)) {
            if (seen.has(row.case)) {
              console.error(`duplicate replay case ${row.case}`);
              process.exit(1);
            }
            seen.add(row.case);
            merged.push(row);
          }
          const required = ["planner_pure", "perception_world", "gameplay_rng", "fixed64", "combat_resolve", "destruction", "gameplay_qa_aravath_slice", "nav_reroute", "causal_bridge", "scripted_system", "weaving", "traversal", "traversal_deformed", "worldgen_columns", "deformed_chunk"];
          const names = new Set(merged.map((row) => row.case));
          for (const name of required) {
            if (!names.has(name)) {
              console.error(`missing required case ${name}`);
              process.exit(1);
            }
          }
          fs.writeFileSync(path.join(root, "replay-hash.json"), JSON.stringify(merged, null, 2) + "\n");
          console.log("merged", merged.map((row) => `${row.case} ${row.sha256}`).join("\n"));
          JS

      - name: Upload replay hash
        uses: actions/upload-artifact@v4
        with:
          name: replay-hash-${{ runner.os }}
          path: target/replay-hash.json
          if-no-files-found: error

  compare:
    name: compare
    needs: hash
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download replay hashes
        uses: actions/download-artifact@v4
        with:
          pattern: replay-hash-*
          path: replay-artifacts
          merge-multiple: false

      - name: Compare replay hashes
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          required = {"planner_pure", "perception_world", "gameplay_rng", "fixed64", "combat_resolve", "destruction", "gameplay_qa_aravath_slice", "nav_reroute", "causal_bridge", "scripted_system", "weaving", "traversal", "traversal_deformed", "worldgen_columns", "deformed_chunk"}
          root = Path("replay-artifacts")
          files = sorted(root.glob("*/replay-hash.json"))
          print(f"artifacts: {[str(p) for p in files]}")
          if len(files) != 3:
              print(f"expected 3 replay-hash artifacts, found {len(files)}")
              sys.exit(1)

          by_os = {}
          for path in files:
              os_name = path.parent.name.removeprefix("replay-hash-")
              rows = json.loads(path.read_text(encoding="utf-8"))
              by_os[os_name] = {row["case"]: row["sha256"] for row in rows}

          cases = set()
          for digests in by_os.values():
              cases.update(digests)

          failed = False
          for case in sorted(cases | required):
              digests = {os_name: mapping.get(case) for os_name, mapping in sorted(by_os.items())}
              present = {value for value in digests.values() if value is not None}
              missing = [os_name for os_name, value in digests.items() if value is None]
              if missing or len(present) != 1:
                  print(f"MISMATCH {case}: {digests}")
                  if case in required:
                      failed = True
                  else:
                      print(f"{case} differs and is not a required case")
              else:
                  digest = next(iter(present))
                  print(f"OK {case} {digest}")

          if failed:
              sys.exit(1)
          PY
