name: Doc-Truth Lint

# Closed-vocabulary prose guard for the Documentation-Truth (D-series) campaign.
# Vocab A (poison) + Vocab B (superlative) literals and the allowlist are read from
# the spec itself (docs/campaigns/doc-truth/CLOSED_VOCABULARY_LINT.md and
# CLOSED_VOCABULARY_ALLOWLIST.md) — spec-as-source, no duplication in the tool.
#
# Vocabulary phase: WARN-MODE (D.3.2b). Annotates un-allowlisted occurrences but
# does not fail the job for those hits. The front-door check always exits
# nonzero: replay cases and the measured frame phrases on ENGINE_STATUS.md.
# `3.117 ms` and `3.688 ms` must be their own tokens on a sentence with
# whole-word median or measured, or sample with is or was. `11 ms` is its
# own token. capture is not a measurement. not, no, nobody, nothing, never,
# cannot, and an n't contraction (ASCII, U+2019, U+02BC, or an apostrophe
# character reference) keep that sentence off the set. A closed HTML comment
# does not supply a phrase. The root README rejects a frame figure as
# CLOSED_VOCABULARY_LINT.md defines it: ms, msec, millisecond, or
# milliseconds, including fullwidth digits, after paired emphasis, alt text,
# autolink text, an unclosed `<`, character references, and invisible
# characters are decoded. A single tilde and an underscore between word
# characters stay. Also the in-progress list and the retired game title.
# Baseline at the 2026-06 wiring: K=0 un-allowlisted vocabulary hits.
#
# Complementary to trace-sync.yml: that gate owns the CLAUDE.md trace table +
# workspace_map.html (a disjoint surface); this scans tracked prose for poison.
# Fix locally with: cargo run -p aw_doc_lint -- --mode warn

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.md'
      - 'gh-pages/**'
      - 'tools/aw_doc_lint/**'
      - '.github/workflows/doc-truth-lint.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'gh-pages/**'
      - 'tools/aw_doc_lint/**'
      - '.github/workflows/doc-truth-lint.yml'
  workflow_dispatch:

# Per pull-request ref. Another PR does not cancel this run. Run 39793896957
# was cancelled at the 20-minute job timeout while rust-ci-setup was still
# restoring the shared crate cache. aw_doc_lint is anyhow + clap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: closed-vocabulary prose lint (warn)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d77020bf130f2e8c39c025bf9c4c3a445fe2b9fa # 1.89.0

      - name: Run doc-truth lint (warn-mode)
        run: cargo run -p aw_doc_lint -- --mode warn
