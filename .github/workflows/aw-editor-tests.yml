name: AW Editor Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/aw_editor/**'
      - 'astraweave-core/**'
      - 'astraweave-llm/**'
      - '.github/workflows/aw-editor-tests.yml'
  schedule:
    # Not on pull_request. These editor test legs are optional and must not
    # take runners ahead of determinism-replay and the PR Rust checks.
    - cron: "35 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test AW Editor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libudev-dev \
            libasound2-dev

      - name: Check Formatting
        run: cargo fmt -p aw_editor -- --check

      - name: Clippy (aw_editor)
        run: cargo clippy -p aw_editor --all-features --no-deps -- -D warnings

      - name: Clippy (astraweave-llm without ollama)
        run: cargo clippy -p astraweave-llm --no-deps -- -D warnings

      - name: Build AW Editor
        run: cargo build -p aw_editor --lib --all-features

      - name: Run Unit Tests
        run: cargo test -p aw_editor --lib --all-features -- --nocapture

      - name: Run Integration Tests
        if: runner.os != 'macOS'
        run: >
          cargo test -p aw_editor --all-features
          --test ui_gizmo_smoke
          --test play_mode
          --test prefab_workflow

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## AW Editor Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platform**: ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Rust Version**: $(rustc --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Blocking gate: fmt, clippy, build, unit tests, and integration tests (Linux/Windows)." >> "$GITHUB_STEP_SUMMARY"
