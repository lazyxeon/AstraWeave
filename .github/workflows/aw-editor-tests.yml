name: AW Editor Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/aw_editor/**'
      - 'astraweave-core/**'
      - '.github/workflows/aw-editor-tests.yml'
  schedule:
    # Not on pull_request. These editor test legs are optional and must not
    # take runners ahead of determinism-replay and the PR Rust checks.
    - cron: "35 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test AW Editor (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Rust CI setup
      uses: ./.github/actions/rust-ci-setup
          
    # Linux-specific: Install dependencies for graphics/windowing
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libegl1-mesa-dev \
          libwayland-dev \
          libudev-dev \
          libasound2-dev
          
    # Build aw_editor (checks compilation)
    - name: Build AW Editor
      run: cargo build -p aw_editor --lib --all-features
      
    # Run library unit tests (headless tests work everywhere)
    - name: Run Unit Tests
      run: cargo test -p aw_editor --lib --all-features -- --nocapture
      continue-on-error: true  # Kept from the previous policy. The bin step fails the job.

    # Bin harness for aw_editor only (`--bin aw_editor`). ci.yml job
    # Test (ubuntu, build archive) runs
    # `cargo test --locked -p aw_editor --all-features --bins`, which also
    # builds the aw_game_runtime harness. That harness has no tests.
    # This workflow is not on pull_request. PR Rust checks needs the
    # archive job. Ruleset enforcement is PR #702
    # (https://github.com/lazyxeon/AstraWeave/pull/702).
    - name: Run editor bin tests
      run: cargo test -p aw_editor --all-features --bin aw_editor -- --nocapture
      
    # Run integration tests (require headless environment)
    - name: Run Integration Tests  
      if: runner.os != 'macOS'  # Skip macOS (no headless X11)
      run: cargo test -p aw_editor --test ui_gizmo_smoke --test play_mode --test prefab_workflow
      continue-on-error: true
      
    # Code quality checks
    - name: Check Formatting
      run: cargo fmt -p aw_editor -- --check
      continue-on-error: true  # Kept from the previous policy.
      
    - name: Run Clippy
      run: cargo clippy -p aw_editor --all-features -- -D warnings
      continue-on-error: true  # Kept from the previous policy. editor-ci.yml enforces clippy -D warnings.
      
    # Generate test report
    - name: Generate Test Summary
      if: always()
      run: |
        echo "## AW Editor Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platform**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
        echo "**Rust Version**: $(rustc --version)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Bin tests: cargo test -p aw_editor --all-features --bin aw_editor fails the job. The harness includes the library modules redeclared by src/main.rs, not only recovery_tests and voxel_tools." >> $GITHUB_STEP_SUMMARY
        echo "- The test job keeps continue-on-error on --lib, integration, fmt, and clippy. The coverage job keeps it on Generate Coverage Report and Upload Coverage to Codecov." >> $GITHUB_STEP_SUMMARY
        echo "- A pull request that is not docs-only, and whose affected set is the full workspace or at least one package, runs cargo test --locked -p aw_editor --all-features --bins in ci.yml, job Test (ubuntu, build archive). PR Rust checks needs that job. Ruleset enforcement is PR #702, https://github.com/lazyxeon/AstraWeave/pull/702. The step has no continue-on-error. --bins also builds the aw_game_runtime harness, which has no tests." >> $GITHUB_STEP_SUMMARY
        
  # Coverage job (optional - Linux only for speed)
  coverage:
    name: Test Coverage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
      
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@599c45df1a24c1c63ae1129a7e59f46654b8fb66 # 1.89.0
      with:
        components: llvm-tools-preview
        
    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libegl1-mesa-dev libudev-dev libasound2-dev
        
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      
    - name: Generate Coverage Report
      run: |
        cargo llvm-cov --package aw_editor --lib --lcov --output-path lcov.info

    - name: Upload coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: aw-editor-lcov
        path: lcov.info
        retention-days: 30

  codecov:
    name: Codecov upload
    needs: coverage
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Download coverage report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: aw-editor-lcov
        path: .

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./lcov.info
        disable_search: true
        flags: aw_editor
        name: aw-editor-coverage
        version: v11.3.2
        fail_ci_if_error: true
        use_oidc: true
