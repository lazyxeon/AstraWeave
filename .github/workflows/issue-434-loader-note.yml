name: Record loader root cause on issue 434

# One-shot note for #434. The integration token used by the coding agent cannot
# edit issues. This job appends the loader root cause with the workflow token.

on:
  pull_request:
    paths:
      - ".github/workflows/issue-434-loader-note.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  note:
    name: Append loader root cause
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- loader-root-434 -->";
            const addition = `${marker}

            ## Loader root cause (2026-10-22)

            The SIGSEGV is in the Vulkan loader, not in a renderer leak and not in lavapipe.

            Ubuntu 26.04 ships \`libvulkan1\` 1.4.341. \`cargo test -p astraweave-render --lib\` loads every Mesa ICD. Debug builds call \`vkSetDebugUtilsObjectNameEXT\` from more than one thread (\`Instance::default()\` enables debug utils; \`WGPU_DEBUG=0\` does not affect that constructor). The loader faults in \`loader_get_icd_and_device\` / \`terminator_SetDebugUtilsObjectNameEXT\`.

            gdb on Mesa 26.0.8-1ubuntu0.3 with libvulkan 1.4.341, every ICD loaded, and \`--test-threads=4\`, in \`gpu_cull_grow_keeps_equal_slots_and_vertex_rewrite_moves_the_box\`:

            - \`libvulkan.so.1\` \`loader_get_icd_and_device\` (PC offset \`0x236d4\` in that build)
            - \`ash\` \`Device::set_debug_utils_object_name\`
            - \`wgpu_hal::vulkan::DeviceShared::set_object_name\`
            - \`create_bind_group_layout\`
            - \`Renderer::new_from_device_monitored\` → \`new_headless\` → \`headless_for_tests\`

            Controls on that same chroot: \`--test-threads=1\` with every ICD loaded does not fault. Lavapipe pinned (\`VK_ICD_FILENAMES\`) at 4 threads does not fault. \`WGPU_DEBUG=0\` still faults when the test uses \`Instance::default()\`.

            This is [Vulkan-Loader #1863](https://github.com/KhronosGroup/Vulkan-Loader/issues/1863), fixed by [PR #1866](https://github.com/KhronosGroup/Vulkan-Loader/pull/1866) (\`5ee27b3\`, recursive mutexes), first released in loader **1.4.344**. Ubuntu 26.04 is still on 1.4.341. Do not file a Mesa bug.

            #438's one-thread hook is a workaround. #434 stays open.

            ## Exit criteria

            Remove the \`serialize_lib_tests\` hook, then on a runner whose \`libvulkan1\` is **≥ 1.4.344**:

            \`cargo test -p astraweave-render --lib\` with no \`VK_ICD_FILENAMES\` and no \`RUST_TEST_THREADS\` exits 0.

            No skipped render tests. Do not mark the toolchain job continue-on-error.
            `.replace(/^ +/gm, "");
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 434,
            });
            const body = issue.body || "";
            if (body.includes(marker) || body.includes("Vulkan-Loader #1863")) {
              core.info("issue 434 already records the loader root cause");
              return;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 434,
              body: `${body}\n\n${addition}\n`,
            });
