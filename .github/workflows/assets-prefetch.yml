name: Prefetch PolyHaven Assets

# Warms the Poly Haven slice of assets/asset_manifest.toml. The CLI defaults to
# the unified manifest; filter to provider polyhaven so optional unregistered
# providers in the same file are skipped.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - assets/asset_manifest.toml
      - assets/polyhaven_manifest.toml
      - .github/workflows/assets-prefetch.yml
  push:
    branches:
      - main
    paths:
      - assets/asset_manifest.toml
      - assets/polyhaven_manifest.toml
      - .github/workflows/assets-prefetch.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prefetch:
    name: Prefetch PolyHaven assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache PolyHaven assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: |
            assets/_downloaded
            .asset_cache
          key: polyhaven-${{ hashFiles('assets/asset_manifest.toml', 'assets/polyhaven_manifest.toml') }}
          restore-keys: |
            polyhaven-

      - uses: ./.github/actions/rust-ci-setup
        if: steps.cache-assets.outputs.cache-hit != 'true'

      - name: Fetch PolyHaven assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cargo run -p astraweave-assets -- fetch --quiet --json \
            --manifest assets/asset_manifest.toml \
            --provider polyhaven > assets_summary.json
          FAILED=$(jq -r '.failed' assets_summary.json)
          if [ "$FAILED" != "0" ]; then
            echo "Asset fetch reported $FAILED failures" >&2
            jq '.assets[] | select(.status == "failed")' assets_summary.json >&2
            exit 1
          fi

      - name: Upload asset artifact
        uses: actions/upload-artifact@v7
        with:
          name: polyhaven-assets
          path: assets/_downloaded
          retention-days: 30
          if-no-files-found: error

      - name: Upload attribution
        uses: actions/upload-artifact@v7
        with:
          name: polyhaven-attribution
          path: assets/_downloaded/**/ATTRIBUTION.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## PolyHaven asset prefetch"
            echo ""
            if [ "${{ steps.cache-assets.outputs.cache-hit }}" = "true" ]; then
              echo "Restored downloaded assets from Actions cache."
            elif [ -f assets_summary.json ]; then
              echo '```json'
              cat assets_summary.json
              echo '```'
            else
              echo "No fetch summary (job failed before fetch)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync("assets_summary.json")) {
              core.info("Skipping PR comment: cache hit or fetch skipped.");
              return;
            }
            const data = JSON.parse(fs.readFileSync("assets_summary.json", "utf8"));
            let body = "## PolyHaven assets (polyhaven provider)\n\n";
            body += `- **Total**: ${data.total_assets}\n`;
            body += `- **Downloaded**: ${data.downloaded}\n`;
            body += `- **Cached**: ${data.cached}\n`;
            body += `- **Failed**: ${data.failed}\n`;
            if (data.failed > 0) {
              body += "\n### Failed handles\n\n";
              for (const row of data.assets.filter((a) => a.status === "failed")) {
                body += `- **${row.handle}** (${row.id}): ${row.error ?? "unknown"}\n`;
              }
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  build-with-assets:
    name: Build with prefetched assets
    needs: prefetch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          name: polyhaven-assets
          path: assets/_downloaded

      - uses: ./.github/actions/rust-ci-setup

      - name: Install Linux link dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build hello_companion
        run: cargo build --release -p hello_companion
