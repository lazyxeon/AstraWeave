name: Benchmark Dashboard

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/benchmark-dashboard.yml'
      - 'scripts/export_benchmark_jsonl.ps1'
      - 'tools/benchmark-dashboard/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  benchmark-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for gh-pages
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-astraweave
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      - name: Run Benchmarks (Subset)
        run: |
          set -euo pipefail
          # ecs_benchmarks is a [[bench]] of astraweave-ecs.
          cargo bench -p astraweave-ecs --bench ecs_benchmarks
          cargo bench -p astraweave-ai --bench ai_core_loop
          cargo bench -p astraweave-behavior --bench goap_planning
          cargo bench -p astraweave-behavior --bench behavior_tree
          cargo bench -p astraweave-terrain --bench terrain_generation
          cargo bench -p astraweave-input --bench input_benchmarks
          cargo bench -p astraweave-physics --bench raycast
          cargo bench -p astraweave-physics --bench character_controller
          cargo bench -p astraweave-physics --bench rigid_body
      
      - name: Install PowerShell
        # ubuntu-latest already has pwsh on PATH (7.6.6 in
        # /opt/microsoft/powershell/7). apt has no `powershell` package on
        # 26.04, which is why run 40438097478 failed. Do not extract a
        # tarball over that prefix: it downgrades the image binary and
        # leaves the newer files in place.
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null; then
            pwsh -NoLogo -Command '$PSVersionTable.PSVersion.ToString()'
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y powershell
          command -v pwsh
          pwsh -NoLogo -Command '$PSVersionTable.PSVersion.ToString()'
      
      - name: Export Benchmark JSONL
        run: |
          pwsh -File scripts/export_benchmark_jsonl.ps1 -Verbose

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas matplotlib seaborn

      - name: Generate static benchmark graphs
        run: python3 scripts/generate_benchmark_graphs.py --input target/benchmark-data/history.jsonl --out-dir gh-pages/graphs

      - name: Export GH-Pages history to JSONL (backup to docs)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          bash scripts/export_benchmark_history.sh

      - name: Prepare Dashboard Assets
        run: |
          set -euo pipefail
          mkdir -p gh-pages
          cp tools/benchmark-dashboard/index.html gh-pages/
          cp tools/benchmark-dashboard/dashboard.js gh-pages/
          
          # Copy static-data snapshot (inline fallback for first deploy)
          mkdir -p gh-pages/static-data
          if [ -d tools/benchmark-dashboard/static-data ]; then
            shopt -s nullglob
            static_files=(tools/benchmark-dashboard/static-data/*)
            if [ "${#static_files[@]}" -gt 0 ]; then
              cp -r "${static_files[@]}" gh-pages/static-data/
            fi
          fi

          # Copy pre-existing graph images from repo
          mkdir -p gh-pages/graphs
          if [ -d tools/benchmark-dashboard/graphs ]; then
            shopt -s nullglob
            graph_files=(tools/benchmark-dashboard/graphs/*)
            if [ "${#graph_files[@]}" -gt 0 ]; then
              cp -r "${graph_files[@]}" gh-pages/graphs/
            fi
          fi
          echo "Copying generated graphs to GH Pages folder"
          ls -la gh-pages/graphs
          
          # Copy benchmark data
          mkdir -p gh-pages/benchmark-data
          if [ -f target/benchmark-data/history.jsonl ]; then
            cp target/benchmark-data/history.jsonl gh-pages/benchmark-data/
          elif [ -f tools/benchmark-dashboard/benchmark-data/history.jsonl ]; then
            cp tools/benchmark-dashboard/benchmark-data/history.jsonl gh-pages/benchmark-data/
          else
            echo "::error::history.jsonl was not produced and no checked-in copy exists"
            exit 1
          fi
          if [ -f tools/benchmark-dashboard/benchmark-data/metadata.json ]; then
            cp tools/benchmark-dashboard/benchmark-data/metadata.json gh-pages/benchmark-data/
          fi

      - name: Verify deployed assets
        run: |
          echo "=== gh-pages contents ==="
          find gh-pages -type f | head -30
          echo ""
          if [ -d gh-pages/graphs ]; then
            COUNT=$(ls gh-pages/graphs | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              echo "Found $COUNT graph(s) to be deployed";
            else
              echo "Warning: No graphs were generated";
            fi
          else
            echo "Warning: gh-pages/graphs directory not found";
          fi
          if [ -f gh-pages/benchmark-data/history.jsonl ]; then
            LINES=$(wc -l < gh-pages/benchmark-data/history.jsonl)
            echo "benchmark-data/history.jsonl: $LINES entries"
          else
            echo "Warning: No benchmark-data/history.jsonl"
          fi
          if [ -f gh-pages/static-data/history.jsonl ]; then
            echo "static-data/history.jsonl: present"
          else
            echo "Warning: No static-data/history.jsonl"
          fi
          
          # Create README for gh-pages
          cat > gh-pages/README.md << 'EOF'
          # AstraWeave Benchmark Dashboard
          
          Live performance telemetry dashboard for the AstraWeave AI-native game engine.
          
          **View Dashboard**: https://lazyxeon.github.io/AstraWeave/dashboard/benchmark_dashboard/
          
          ## Features
          - 30-day performance trends
          - System filtering (ECS, AI, Physics, Terrain, Input)
          - Interactive d3.js charts
          - Regression detection
          
          ## Data Source
          Updated nightly via GitHub Actions from Criterion benchmark results.
          
          Last Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          destination_dir: dashboard/benchmark_dashboard
          keep_files: true
          commit_message: 'Update benchmark dashboard: ${{ github.sha }}'

      - name: Summary
        run: |
          echo "### Benchmark Dashboard Updated ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dashboard URL**: https://lazyxeon.github.io/AstraWeave/dashboard/benchmark_dashboard/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f target/benchmark-data/history.jsonl ]; then
            ENTRY_COUNT=$(wc -l < target/benchmark-data/history.jsonl)
            echo "**Benchmark Entries**: $ENTRY_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d gh-pages/graphs ]; then
            GRAPH_COUNT=$(ls gh-pages/graphs | wc -l)
            echo "**Static Graphs Generated**: $GRAPH_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Last Updated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
