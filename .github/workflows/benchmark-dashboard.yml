name: Benchmark Dashboard

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/benchmark-dashboard.yml'
      - 'scripts/export_benchmark_jsonl.ps1'
      - 'tools/benchmark-dashboard/**'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  benchmark-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Need full history for gh-pages
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-astraweave
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      
      - name: Install bench build dependencies
        # terrain_generation and input_benchmarks link libudev. benchmark.yml
        # installs pkg-config and libudev-dev via rust-ci-setup. Without them
        # this job's export omits heightmap_generation_64x64,
        # world_chunk_generation, binding_creation, and binding_lookup, and
        # -Strict fails on the missing keys.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev

      - name: Run Benchmarks (Subset)
        run: |
          # Run core benchmarks (limit to 30 min)
          # core_benchmarks is the astraweave-core target. ecs_benchmarks
          # lives on astraweave-ecs and is not this package, so the old
          # invocation wrote no world_creation row.
          cargo bench -p astraweave-core --bench core_benchmarks || true
          cargo bench -p astraweave-ai --bench ai_core_loop || true
          cargo bench -p astraweave-behavior --bench goap_planning || true
          cargo bench -p astraweave-behavior --bench behavior_tree || true
          cargo bench -p astraweave-terrain --bench terrain_generation || true
          cargo bench -p astraweave-input --bench input_benchmarks || true
          cargo bench -p astraweave-physics --bench raycast || true
          cargo bench -p astraweave-physics --bench character_controller || true
          cargo bench -p astraweave-physics --bench rigid_body || true
        continue-on-error: true
      
      - name: Install PowerShell
        # ubuntu-latest already has pwsh on PATH (7.6.6 in
        # /opt/microsoft/powershell/7). apt has no `powershell` package on
        # 26.04, which is why run 40438097478 failed. Do not extract a
        # tarball over that prefix: it downgrades the image binary and
        # leaves the newer files in place.
        run: |
          set -euo pipefail
          if command -v pwsh >/dev/null; then
            pwsh -NoLogo -Command '$PSVersionTable.PSVersion.ToString()'
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y powershell
          command -v pwsh
          pwsh -NoLogo -Command '$PSVersionTable.PSVersion.ToString()'
      
      - name: Export Benchmark JSONL
        run: |
          pwsh -File scripts/export_benchmark_jsonl.ps1 -Verbose

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas matplotlib seaborn

      - name: Generate static benchmark graphs
        run: |
          python3 scripts/generate_benchmark_graphs.py --input target/benchmark-data/history.jsonl --out-dir gh-pages/graphs || true

      - name: Export GH-Pages history to JSONL (backup to docs)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          bash scripts/export_benchmark_history.sh || true
      
      - name: Check for Regressions
        id: regression-check
        # benchmark.yml writes benchmark_results/benchmarks.json. This job
        # writes target/benchmark-data/history.jsonl. Run 39532631733 logged
        # "Benchmark results not found" and continue-on-error hid the exit.
        run: |
          set -euo pipefail
          hist="target/benchmark-data/history.jsonl"
          out="target/benchmark-data/threshold-input.json"
          mkdir -p target/benchmark-data
          if [ ! -s "$hist" ]; then
            echo "Benchmark results not found: $hist" | tee target/benchmark-data/regression-report.txt
            exit 1
          fi
          python3 - "$hist" "$out" <<'PY'
          import json
          import sys

          hist, out = sys.argv[1], sys.argv[2]
          latest = {}
          with open(hist, encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if not line:
                      continue
                  row = json.loads(line)
                  name = row.get("benchmark_name")
                  if not name or "value" not in row:
                      continue
                  latest[name] = row
          payload = [
              {
                  "name": row["benchmark_name"],
                  "value": row["value"],
                  "unit": row.get("unit") or "ns",
              }
              for row in latest.values()
          ]
          if not payload:
              sys.exit("Benchmark results not found: " + hist)
          with open(out, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          print(f"Checking {len(payload)} benchmark result(s) from {hist}")
          PY
          set +e
          pwsh -File scripts/check_benchmark_thresholds.ps1 -BenchmarkJsonPath "$out" -ShowDetails -Strict \
            > target/benchmark-data/regression-report.txt 2>&1
          code=$?
          set -e
          cat target/benchmark-data/regression-report.txt
          exit "$code"
      
      - name: Prepare Dashboard Assets
        if: ${{ !cancelled() }}
        run: |
          mkdir -p gh-pages
          cp tools/benchmark-dashboard/index.html gh-pages/
          cp tools/benchmark-dashboard/dashboard.js gh-pages/
          
          # Copy static-data snapshot (inline fallback for first deploy)
          mkdir -p gh-pages/static-data
          if [ -d tools/benchmark-dashboard/static-data ]; then
            cp -r tools/benchmark-dashboard/static-data/* gh-pages/static-data/ 2>/dev/null || true
          fi
          
          # Copy pre-existing graph images from repo
          mkdir -p gh-pages/graphs
          if [ -d tools/benchmark-dashboard/graphs ]; then
            cp -r tools/benchmark-dashboard/graphs/* gh-pages/graphs/ 2>/dev/null || true
          fi
          # Also copy any CI-generated graphs (overwrite stale ones)
          if [ -d gh-pages/graphs ]; then
            echo 'Copying generated graphs to GH Pages folder' && ls -la gh-pages/graphs || true
          fi
          
          # Copy benchmark data
          mkdir -p gh-pages/benchmark-data
          if [ -f target/benchmark-data/history.jsonl ]; then
            cp target/benchmark-data/history.jsonl gh-pages/benchmark-data/
          elif [ -f tools/benchmark-dashboard/benchmark-data/history.jsonl ]; then
            # Fall back to the checked-in benchmark data
            cp tools/benchmark-dashboard/benchmark-data/history.jsonl gh-pages/benchmark-data/
          fi
          if [ -f tools/benchmark-dashboard/benchmark-data/metadata.json ]; then
            cp tools/benchmark-dashboard/benchmark-data/metadata.json gh-pages/benchmark-data/
          fi

      - name: Verify deployed assets
        if: ${{ !cancelled() }}
        run: |
          echo "=== gh-pages contents ==="
          find gh-pages -type f | head -30
          echo ""
          if [ -d gh-pages/graphs ]; then
            COUNT=$(ls gh-pages/graphs | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              echo "Found $COUNT graph(s) to be deployed";
            else
              echo "Warning: No graphs were generated";
            fi
          else
            echo "Warning: gh-pages/graphs directory not found";
          fi
          if [ -f gh-pages/benchmark-data/history.jsonl ]; then
            LINES=$(wc -l < gh-pages/benchmark-data/history.jsonl)
            echo "benchmark-data/history.jsonl: $LINES entries"
          else
            echo "Warning: No benchmark-data/history.jsonl"
          fi
          if [ -f gh-pages/static-data/history.jsonl ]; then
            echo "static-data/history.jsonl: present"
          else
            echo "Warning: No static-data/history.jsonl"
          fi
          
          # Create README for gh-pages
          cat > gh-pages/README.md << 'EOF'
          # AstraWeave Benchmark Dashboard
          
          Live performance telemetry dashboard for the AstraWeave AI-native game engine.
          
          **View Dashboard**: https://lazyxeon.github.io/AstraWeave/dashboard/benchmark_dashboard/
          
          ## Features
          - 30-day performance trends
          - System filtering (ECS, AI, Physics, Terrain, Input)
          - Interactive d3.js charts
          - Regression detection
          
          ## Data Source
          Updated nightly via GitHub Actions from Criterion benchmark results.
          
          Last Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
      
      - name: Deploy to GitHub Pages
        if: ${{ !cancelled() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
          destination_dir: dashboard/benchmark_dashboard
          keep_files: true
          commit_message: 'Update benchmark dashboard: ${{ github.sha }}'
      
      - name: Create Regression Issue (if needed)
        if: failure() && steps.regression-check.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { parseBenchmarkReport, issueTitle, issueBullets } = require('./scripts/ci/benchmark_issue_title.js');
            const reportPath = 'target/benchmark-data/regression-report.txt';
            const report = fs.existsSync(reportPath) ? fs.readFileSync(reportPath, 'utf8') : '';
            const parsed = parseBenchmarkReport(report);
            const title = issueTitle(parsed, context.sha);
            const named = issueBullets(parsed);
            const excerpt = report.length > 6000 ? report.slice(0, 6000) + '\n…' : report;
            const body = `## Automated benchmark check

            **Date**: ${new Date().toISOString()}
            **Commit**: ${context.sha}
            **Branch**: ${context.ref}

            ${named || 'The regression check failed. The report is below.'}

            max_allowed is 1.5 times the baseline. This is not a fixed 10% rule.

            \`\`\`
            ${excerpt || '(no regression-report.txt)'}
            \`\`\`

            [View Dashboard](https://lazyxeon.github.io/AstraWeave/dashboard/benchmark_dashboard/)

            **Auto-generated by benchmark-dashboard.yml**
            `;

            // Issue #184 is open under "Benchmark Regression Detected". A new
            // failure uses a title that names the benches, or a separate title
            // when the history file or threshold keys are missing. The same
            // title gets a comment; a different failure opens a new issue.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'performance,regression',
              per_page: 100,
            });
            const existingIssue = issues.find((issue) => issue.title === title);
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['performance', 'regression', 'automated']
              });
              console.log('Created regression issue: ' + title);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body,
              });
              console.log('Updated regression issue #' + existingIssue.number);
            }
      
      - name: Summary
        run: |
          echo "### Benchmark Dashboard Updated ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dashboard URL**: https://lazyxeon.github.io/AstraWeave/dashboard/benchmark_dashboard/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f target/benchmark-data/history.jsonl ]; then
            ENTRY_COUNT=$(wc -l < target/benchmark-data/history.jsonl)
            echo "**Benchmark Entries**: $ENTRY_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d gh-pages/graphs ]; then
            GRAPH_COUNT=$(ls gh-pages/graphs | wc -l)
            echo "**Static Graphs Generated**: $GRAPH_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Last Updated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
