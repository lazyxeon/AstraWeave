name: Comprehensive CI Pipeline

# PR tier (required): detect, gate (fmt + one clippy + check), one Linux
# archive build plus 3 partition runs, one Windows archive build plus 3
# partition runs, MSRV.
# Docs-only pulls skip the compile steps. The cross-OS replay hash check is
# Determinism Replay, which is a separate workflow with no path filter.
# Heavy optional workflows (PBR, editor, AW Editor tests) are not on
# pull_request, so they do not occupy runners ahead of this workflow.
#
# Main, schedule, and workflow_dispatch: the same gate against the full
# workspace, then the 3-OS test matrix and a release build. Sanitizers,
# coverage, CodeQL, the 6-toolchain matrix, and benchmarks live in their own
# workflows and do not run on pull requests.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  EXCLUDED_PACKAGES: >-
    --exclude astraweave-author
    --exclude visual_3d
    --exclude ui_controls_demo
    --exclude npc_town_demo
    --exclude rhai_authoring
    --exclude cutscene_render_demo
    --exclude weaving_playground
    --exclude combat_physics_demo
    --exclude navmesh_demo
    --exclude physics_demo3d
    --exclude debug_toolkit_demo
    --exclude aw_editor

jobs:
  changes:
    name: Detect affected crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      full: ${{ steps.detect.outputs.full }}
      packages: ${{ steps.detect.outputs.packages }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Depth 2 is the merge commit and both parents. Depth 1 cannot
          # see the base parent. Depth 0 makes actions/checkout fetch every
          # branch and every tag; run 40747800523 was cancelled at 10 minutes
          # in that fetch, before classify ran.
          fetch-depth: 2
          fetch-tags: false

      - name: Classify the diff
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "docs_only=false"
              echo "full=true"
              echo "packages="
              echo "reason=non-pull-request"
            } >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify --quiet 'HEAD^1' >/dev/null; then
            # Unsure which files changed. A full run is the safe result.
            {
              echo "docs_only=false"
              echo "full=true"
              echo "packages="
              echo "reason=missing-merge-parent"
            } >> "$GITHUB_OUTPUT"
          else
            # pull_request checks out refs/pull/N/merge. The first parent is
            # the base commit GitHub merged, so three-dot against it is the
            # pull request diff. Fetching the base branch would pull that
            # branch's whole history.
            python3 scripts/ci/affected_crates.py \
              --base "HEAD^1" \
              --head HEAD \
              --github-output "$GITHUB_OUTPUT"
          fi

  gate:
    name: Gate (fmt, clippy, check)
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Player-facing name check
        run: bash scripts/ci/player_facing_names.sh

      - name: Workflow policy
        run: python3 scripts/ci/test_workflow_policy.py

      - name: Rust CI setup
        if: needs.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/rust-ci-setup

      - name: Fmt, clippy, check
        env:
          AW_CI_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          AW_CI_FULL: ${{ needs.changes.outputs.full }}
          AW_CI_PACKAGES: ${{ needs.changes.outputs.packages }}
          AW_CI_EXCLUDES: ${{ env.EXCLUDED_PACKAGES }}
        run: bash scripts/ci/run-gate.sh

      - name: sccache stats
        if: always() && needs.changes.outputs.docs_only != 'true'
        run: sccache --show-stats || true

  test-linux-build:
    name: Test (ubuntu, build archive)
    runs-on: ubuntu-latest
    needs: [changes, gate]
    # 60, not 45. Run 40235303264 compiled the test profile in 24m 12s and
    # then spent 6m 05s running 31672 tests. A dev-profile aw_audio_probe
    # before that compile took another 7m 15s and could not be reused.
    # This job compiles once (debuginfo off, same as the Windows archive),
    # builds the probe with the test profile, and uploads both. Partition
    # jobs do not compile. The archive is not built inside the gate: that
    # would hold the Windows archive until this compile finished.
    timeout-minutes: 60
    if: >-
      github.event_name == 'pull_request' &&
      needs.gate.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.packages != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Greybox tests open KayKit glTF buffers. An LFS pointer is ~130 bytes
          # and the importer rejects it.
          lfs: true

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          install-nextest: "true"

      - name: Archive tests once
        env:
          AW_CI_FULL: ${{ needs.changes.outputs.full }}
          AW_CI_PACKAGES: ${{ needs.changes.outputs.packages }}
          AW_CI_EXCLUDES: ${{ env.EXCLUDED_PACKAGES }}
          AW_CI_ARCHIVE_OUT: target/nextest-archive.tar.zst
          # Debuginfo is link time and artifact size. Test behavior does not
          # change: debug assertions stay on.
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: bash scripts/ci/run-tests.sh

      - name: Build the audio device probe
        # After the archive, in the test profile, so the probe links against
        # objects this job already built. A dev-profile build first does not.
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          cargo build --locked --profile test -p astraweave-audio --bin aw_audio_probe
          stage="${RUNNER_TEMP}/linux-nextest"
          mkdir -p "$stage"
          cp target/nextest-archive.tar.zst "$stage/"
          cp target/debug/aw_audio_probe "$stage/aw_audio_probe"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-linux
          path: |
            ${{ runner.temp }}/linux-nextest/nextest-archive.tar.zst
            ${{ runner.temp }}/linux-nextest/aw_audio_probe
          if-no-files-found: error
          retention-days: 1
          # The archive is already zstd. Skip a second compression pass.
          compression-level: 0

      - name: Net client binaries on this machine
        # CARGO_BIN_EXE_aw-net-client is this runner's target path. Partition
        # jobs only have the extracted archive, so profile ci-pr-linux-archive
        # skips these two targets.
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          AW_CI_FULL: ${{ needs.changes.outputs.full }}
          AW_CI_PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail
          pkgs=",${AW_CI_PACKAGES},"
          if [ "$AW_CI_FULL" = "true" ] || [[ "$pkgs" == *",aw-net-client,"* ]]; then
            cargo nextest run --locked --profile ci-pr -p aw-net-client --test family1_client_binary --test family3_client_binary_wrong_key
          else
            echo "aw-net-client is not in the affected set; skipping the client binaries"
          fi

      - name: Model HTTP tests
        # After the upload so a feature rebuild does not hold the artifact.
        # loopback_http_proxy and ollama_chat_probe are cfg(feature = "ollama")
        # and spawn CARGO_BIN_EXE paths on this machine. Partitions skip them.
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          AW_CI_FULL: ${{ needs.changes.outputs.full }}
          AW_CI_PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          pkgs=",${AW_CI_PACKAGES},"
          if [ "$AW_CI_FULL" = "true" ] || [[ "$pkgs" == *",astraweave-llm,"* ]]; then
            cargo nextest run --locked --profile ci-pr -p astraweave-llm --features ollama --test loopback_http_proxy --test ollama_chat_probe
            cargo nextest run --locked --profile ci-pr -p astraweave-llm --features ollama --lib ollama_assembled
            cargo nextest run --locked --profile ci-pr -p astraweave-llm --features ollama --lib a_saturated_limit_is_refused stops_before_the_rest_of_the_body ndjson_scan_
          fi
          if [ "$AW_CI_FULL" = "true" ] || [[ "$pkgs" == *",astraweave-embeddings,"* ]]; then
            cargo nextest run --locked --profile ci-pr -p astraweave-embeddings --features http --test declared_body_timeout
            cargo nextest run --locked --profile ci-pr -p astraweave-embeddings --features http --lib embedding_cap_fits_a_normal_batch embedding_rows_follow_their_index
          fi
          if [ "$AW_CI_FULL" != "true" ] && [[ "$pkgs" != *",astraweave-llm,"* ]] && [[ "$pkgs" != *",astraweave-embeddings,"* ]]; then
            echo "Model crates are not in the affected set; skipping the ollama feature tests"
          fi

  test-linux:
    name: Test (ubuntu, ${{ matrix.partition }}/3)
    runs-on: ubuntu-latest
    needs: [changes, gate, test-linux-build]
    timeout-minutes: 30
    if: >-
      github.event_name == 'pull_request' &&
      needs.gate.result == 'success' &&
      needs.test-linux-build.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.packages != '')
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The archived tests load KayKit files from this checkout.
          lfs: true

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          install-nextest: "true"

      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-linux
          path: target

      - name: Nextest partition
        env:
          AW_CI_ARCHIVE_RUN: target/nextest-archive.tar.zst
          AW_CI_PARTITION: count:${{ matrix.partition }}/3
          AW_CI_PROFILE: ci-pr-linux-archive
          AW_AUDIO_PROBE_BIN: ${{ github.workspace }}/target/aw_audio_probe
          # Nav stress ceilings in astraweave-nav. About 10× the old debug
          # bounds, so a hang fails and the 12.2 ms sample does not. #575.
          AW_PERF_ASSERTS: "1"
        run: bash scripts/ci/run-tests.sh

  test-windows-build:
    name: Test (windows, build archive)
    runs-on: windows-latest
    needs: [changes, gate]
    # 75, not 45. Each of the old partitions compiled the workspace and was
    # cancelled at 45 minutes. One Windows debug compile of this workspace is
    # about 50 minutes (the pre-tiering job used 60). This job compiles once,
    # writes a zstd archive, and uploads it. Partition jobs do not compile.
    # CARGO_PROFILE_TEST_DEBUG=0 keeps that archive under the artifact cap.
    timeout-minutes: 75
    if: >-
      github.event_name == 'pull_request' &&
      needs.gate.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.packages != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          install-nextest: "true"

      - name: Archive tests once
        env:
          AW_CI_FULL: ${{ needs.changes.outputs.full }}
          AW_CI_PACKAGES: ${{ needs.changes.outputs.packages }}
          AW_CI_EXCLUDES: ${{ env.EXCLUDED_PACKAGES }}
          AW_CI_ARCHIVE_OUT: target/nextest-archive.tar.zst
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: bash scripts/ci/run-tests.sh

      - name: Net client binaries on this machine
        # CARGO_BIN_EXE_aw-net-client is this runner's target path. Partition
        # jobs only have the extracted archive, so they skip these two targets.
        # Keep the archive profile so this follow-up does not rebuild with debug info.
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo nextest run --locked --profile ci -p aw-net-client --test family1_client_binary --test family3_client_binary_wrong_key

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-windows
          path: target/nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
          # The archive is already zstd. Skip a second compression pass.
          compression-level: 0

      - name: Model HTTP probes on this machine
        # After the archive upload so a feature rebuild does not hold the
        # artifact. Only when those crates are affected: a failure here still
        # fails the build job, and the partition jobs need that job to succeed.
        # CARGO_BIN_EXE_* is this runner's target path. Keep the archive profile
        # so this follow-up does not rebuild with debug info.
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          AW_CI_FULL: ${{ needs.changes.outputs.full }}
          AW_CI_PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          pkgs=",${AW_CI_PACKAGES},"
          if [ "$AW_CI_FULL" = "true" ] || [[ "$pkgs" == *",astraweave-llm,"* ]]; then
            cargo nextest run --locked --profile ci -p astraweave-llm --features ollama --test loopback_http_proxy --test ollama_chat_probe
            cargo nextest run --locked --profile ci -p astraweave-llm --features ollama --lib ollama_assembled
            cargo nextest run --locked --profile ci -p astraweave-llm --features ollama --lib a_saturated_limit_is_refused stops_before_the_rest_of_the_body ndjson_scan_
          fi
          if [ "$AW_CI_FULL" = "true" ] || [[ "$pkgs" == *",astraweave-embeddings,"* ]]; then
            cargo nextest run --locked --profile ci -p astraweave-embeddings --features http --test declared_body_timeout
            cargo nextest run --locked --profile ci -p astraweave-embeddings --features http --lib embedding_cap_fits_a_normal_batch embedding_rows_follow_their_index
          fi
          if [ "$AW_CI_FULL" != "true" ] && [[ "$pkgs" != *",astraweave-llm,"* ]] && [[ "$pkgs" != *",astraweave-embeddings,"* ]]; then
            echo "Model crates are not in the affected set; skipping the model HTTP probes"
          fi

  test-windows:
    name: Test (windows, ${{ matrix.partition }}/3)
    runs-on: windows-latest
    needs: [changes, gate, test-windows-build]
    timeout-minutes: 30
    if: >-
      github.event_name == 'pull_request' &&
      needs.gate.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.packages != '')
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The archived tests load KayKit files from this checkout.
          lfs: true

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          install-nextest: "true"

      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-windows
          path: target

      - name: Nextest partition
        env:
          AW_CI_ARCHIVE_RUN: target/nextest-archive.tar.zst
          AW_CI_PARTITION: count:${{ matrix.partition }}/3
          AW_CI_PROFILE: ci-pr-archive
          # Same nav ceilings as the Linux partitions. #575.
          AW_PERF_ASSERTS: "1"
        run: bash scripts/ci/run-tests.sh

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    needs: [changes, gate]
    timeout-minutes: 40
    if: >-
      needs.gate.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.packages != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read rust-version
        id: msrv
        run: |
          set -euo pipefail
          version=$(grep -m1 'rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$version" ]; then
            echo "rust-version is missing from the workspace Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV $version"

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: rustfmt,clippy

      - name: cargo check on the MSRV toolchain
        env:
          AW_CI_FULL: ${{ needs.changes.outputs.full }}
          AW_CI_PACKAGES: ${{ needs.changes.outputs.packages }}
          AW_CI_EXCLUDES: ${{ env.EXCLUDED_PACKAGES }}
        run: |
          set -euo pipefail
          if [ "$AW_CI_FULL" = "true" ]; then
            # shellcheck disable=SC2086
            cargo check --locked --workspace ${AW_CI_EXCLUDES}
          else
            IFS=',' read -ra pkgs <<< "$AW_CI_PACKAGES"
            args=(cargo check --locked)
            for pkg in "${pkgs[@]}"; do
              if [ -n "$pkg" ]; then
                args+=(-p "$pkg")
              fi
            done
            "${args[@]}"
          fi

  pr-rust-checks:
    name: PR Rust checks
    runs-on: ubuntu-latest
    needs: [changes, gate, test-linux-build, test-linux, test-windows, msrv]
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Require the gate and every heavy job that had work to do
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          gate="${{ needs.gate.result }}"
          linux_build="${{ needs.test-linux-build.result }}"
          linux="${{ needs.test-linux.result }}"
          windows="${{ needs.test-windows.result }}"
          msrv="${{ needs.msrv.result }}"
          docs="${{ needs.changes.outputs.docs_only }}"
          full="${{ needs.changes.outputs.full }}"
          packages="${{ needs.changes.outputs.packages }}"
          echo "changes=$changes gate=$gate linux_build=$linux_build linux=$linux windows=$windows msrv=$msrv docs_only=$docs full=$full"
          [ "$changes" = "success" ]
          [ "$gate" = "success" ]
          if [ "$docs" = "true" ]; then
            echo "Docs-only pull request; compile jobs were not required"
            exit 0
          fi
          if [ "$full" != "true" ] && [ -z "$packages" ]; then
            echo "No crates changed; fmt gate is sufficient"
            exit 0
          fi
          [ "$linux_build" = "success" ]
          [ "$linux" = "success" ]
          [ "$windows" = "success" ]
          [ "$msrv" = "success" ]

  test-full:
    name: Test full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, gate]
    # 60, not 45: the historical Windows debug workspace test ran about 50 minutes.
    timeout-minutes: 60
    if: github.event_name != 'pull_request' && needs.gate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        # Windows is test-full-windows-* below. One 60-minute job was still
        # inside nextest when the clock ran out (issue #433).
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          install-nextest: "true"

      - name: Build the audio device probe
        run: cargo build --locked -p astraweave-audio --bin aw_audio_probe

      - name: macOS runners have no wgpu software adapter
        if: runner.os == 'macOS'
        run: |
          echo "AW_GPU_SKIP_IF_UNAVAILABLE=1" >> "$GITHUB_ENV"
          echo "AW_GPU_SKIP_LOG=${GITHUB_WORKSPACE}/target/gpu-skip-reasons.txt" >> "$GITHUB_ENV"

      - name: Workspace nextest
        id: workspace-nextest
        env:
          AW_CI_FULL: "true"
          AW_CI_EXCLUDES: ${{ env.EXCLUDED_PACKAGES }}
        run: bash scripts/ci/run-tests.sh

      - name: Report GPU skips
        if: always()
        shell: bash
        env:
          NEXTEST_OUTCOME: ${{ steps.workspace-nextest.outcome }}
        run: bash scripts/ci/check-gpu-skip-log.sh

  # Windows Test full: compile once, then run three partitions. Each job
  # keeps timeout-minutes at 60. Partitions use profile ci-full-archive
  # (profile ci without the four CARGO_BIN_EXE binaries). The archive job
  # runs those four on the machine that compiled them. The GPU rows in
  # archive_only_skips.txt stay on profile ci, so nightly still runs them.
  test-full-windows-build:
    name: Test full (windows, build archive)
    runs-on: windows-latest
    needs: [changes, gate]
    timeout-minutes: 60
    if: github.event_name != 'pull_request' && needs.gate.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          install-nextest: "true"

      - name: Archive tests once
        env:
          AW_CI_FULL: "true"
          AW_CI_EXCLUDES: ${{ env.EXCLUDED_PACKAGES }}
          AW_CI_ARCHIVE_OUT: target/nextest-archive.tar.zst
          # Debuginfo is most of the Windows link time and the artifact size.
          # Test behavior does not change.
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: bash scripts/ci/run-tests.sh

      - name: Net client binaries on this machine
        # CARGO_BIN_EXE_aw-net-client is this runner's target path. Partition
        # jobs only have the extracted archive. Profile ci-full-archive does
        # not run these two targets again.
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo nextest run --locked --profile ci -p aw-net-client --test family1_client_binary --test family3_client_binary_wrong_key

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-windows-full
          path: target/nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Model HTTP probes on this machine
        # After the upload so a feature rebuild does not hold the artifact.
        # CARGO_BIN_EXE_* is this runner's target path. Partition jobs do not
        # run these targets. Keep the archive profile so this does not rebuild
        # with debug info.
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          cargo nextest run --locked --profile ci -p astraweave-llm --features ollama --test loopback_http_proxy --test ollama_chat_probe
          cargo nextest run --locked --profile ci -p astraweave-llm --features ollama --lib ollama_assembled

  test-full-windows-part:
    name: Test full (windows, ${{ matrix.partition }}/3)
    runs-on: windows-latest
    needs: [changes, gate, test-full-windows-build]
    timeout-minutes: 60
    if: github.event_name != 'pull_request' && needs.gate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          install-nextest: "true"

      - name: Build the audio device probe
        run: cargo build --locked -p astraweave-audio --bin aw_audio_probe

      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-windows-full
          path: target

      - name: Nextest partition
        env:
          AW_CI_ARCHIVE_RUN: target/nextest-archive.tar.zst
          AW_CI_PARTITION: count:${{ matrix.partition }}/3
          # ci would spawn CARGO_BIN_EXE paths that exist only on the archive
          # runner. ci-full-archive is profile ci without those four binaries.
          # The archive job runs them. This is not the pull-request filter.
          AW_CI_PROFILE: ci-full-archive
          AW_AUDIO_PROBE_BIN: ${{ github.workspace }}/target/debug/aw_audio_probe.exe
        run: bash scripts/ci/run-tests.sh

  test-full-windows:
    name: Test full (windows-latest)
    runs-on: ubuntu-latest
    needs: [changes, gate, test-full-windows-build, test-full-windows-part]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.gate.result == 'success'
    timeout-minutes: 5
    steps:
      - name: Require the archive build and every partition
        run: |
          set -euo pipefail
          build="${{ needs.test-full-windows-build.result }}"
          parts="${{ needs.test-full-windows-part.result }}"
          echo "build=$build parts=$parts"
          [ "$build" = "success" ]
          [ "$parts" = "success" ]

  build-release:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, gate]
    timeout-minutes: 45
    if: github.event_name != 'pull_request' && needs.gate.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup

      - name: Release build of the core crates
        run: >
          cargo build --locked --release
          -p astraweave-core
          -p astraweave-ai
          -p astraweave-physics
          -p astraweave-nav
          -p astraweave-render
          -p hello_companion

  demo:
    name: Demo Validation
    runs-on: ubuntu-latest
    needs: [changes, gate]
    timeout-minutes: 30
    if: github.event_name != 'pull_request' && needs.gate.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup

      - name: Veilweaver slice smoke test
        run: |
          cargo build --locked -p veilweaver_slice_loader
          timeout 120s make smoke-veilweaver

      - name: Build demo applications
        run: |
          cargo build --release -p hello_companion
          cargo build --release -p ipc_loopback

      - name: Run hello_companion demo (with timeout)
        run: |
          echo "Testing hello_companion demo..."
          timeout 10s cargo run --release -p hello_companion || echo "Demo completed or timed out as expected"

      - name: Validate IPC loopback example
        run: |
          echo "Testing IPC loopback example..."
          cargo run --release -p ipc_loopback --bin server &
          SERVER_PID=$!
          sleep 2
          timeout 5s cargo run --release -p ipc_loopback --bin client || echo "IPC test completed"
          kill $SERVER_PID 2>/dev/null || true
