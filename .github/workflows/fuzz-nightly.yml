# Nightly parser fuzzing. Not on pull requests.
# The matrix is every [[bin]] in a fuzz/Cargo.toml (scripts/ci/fuzz_targets.py).
# Each target is capped at 120 seconds. The corpus is a workflow artifact
# named fuzz-corpus-<target>, restored from the newest successful run of
# this workflow on the default branch of this repository.
# Crash reproducers are uploaded. The workflow token is contents: read and
# actions: read. The fuzz job adds actions: write so upload-artifact can
# save the corpus and the crash files.

name: Fuzz nightly

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  targets:
    name: List fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: List cargo-fuzz bins
        id: list
        run: |
          {
            echo "matrix<<EOF"
            python3 scripts/ci/fuzz_targets.py
            echo EOF
          } >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # upload-artifact rejects a token that only has actions: read.
    # Write stays on this job. The list job above stays contents: read.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        # rust-toolchain.toml pins 1.89.0, so a bare `cargo` is stable.
        # cargo-fuzz 0.13.1 does not build on current nightly (rustix).
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Restore corpus
        env:
          FUZZ_DIR: ${{ matrix.dir }}
          FUZZ_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
          CORPUS_BRANCH: ${{ github.event.repository.default_branch }}
          CORPUS_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$FUZZ_DIR/corpus/$FUZZ_TARGET"
          case "$FUZZ_TARGET" in
            *[!A-Za-z0-9_]*) echo "refusing target name" >&2; exit 1 ;;
          esac
          if [ -z "$CORPUS_BRANCH" ] || [ -z "$CORPUS_REPOSITORY" ]; then
            echo "refusing corpus restore without a default branch and repository" >&2
            exit 1
          fi
          name="fuzz-corpus-${FUZZ_TARGET}"
          runs_payload="$(mktemp)"
          payload="$(mktemp)"
          branch_q="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["CORPUS_BRANCH"], safe=""))')"
          if ! gh api --paginate "repos/${CORPUS_REPOSITORY}/actions/workflows/fuzz-nightly.yml/runs?per_page=100&status=success&branch=${branch_q}&exclude_pull_requests=true" >"$runs_payload"; then
            echo "Workflow run list failed; starting with an empty corpus."
            exit 0
          fi
          if ! gh api --paginate "repos/${CORPUS_REPOSITORY}/actions/artifacts?per_page=100&name=${name}" >"$payload"; then
            echo "Artifact list failed; starting with an empty corpus."
            exit 0
          fi
          run_id="$(python3 scripts/ci/fuzz_corpus_artifact.py "$THIS_RUN" "$CORPUS_BRANCH" "$CORPUS_REPOSITORY" "$runs_payload" <"$payload")"
          if [ -z "$run_id" ]; then
            echo "No previous corpus artifact; starting empty."
            exit 0
          fi
          case "$run_id" in
            *[!0-9]*) echo "refusing run id" >&2; exit 1 ;;
          esac
          tmp="$(mktemp -d)"
          if ! gh run download "$run_id" --name "$name" --dir "$tmp/out"; then
            echo "Corpus download failed; starting empty."
            exit 0
          fi
          find "$tmp/out" -type f -exec cp {} "$FUZZ_DIR/corpus/$FUZZ_TARGET/" \;

      - name: Fuzz for two minutes
        working-directory: ${{ matrix.dir }}
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        # cargo-fuzz passes -Z, which stable rejects.
        run: cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time=120

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ matrix.dir }}/artifacts/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Save corpus
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ matrix.dir }}/corpus/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
