# Nightly parser fuzzing. Not on pull requests: each target is capped at
# two minutes so this job cannot stretch pull-request CI.

name: Fuzz nightly

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: persistence/aw-save/fuzz
            target: fuzz_awsv
          - dir: astraweave-combat/fuzz
            target: fuzz_vitals
          - dir: astraweave-asset/fuzz
            target: fuzz_gltf_json
          - dir: astraweave-asset/fuzz
            target: fuzz_cell_ron
          - dir: net/aw-net-proto/fuzz
            target: fuzz_decode_msg
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust nightly
        uses: ./.github/actions/rust-nightly
        with:
          components: llvm-tools-preview

      - name: Cache cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.1

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null; then
            cargo install cargo-fuzz --version 0.13.1 --locked
          fi

      - name: Fuzz ${{ matrix.target }} for two minutes
        working-directory: ${{ matrix.dir }}
        # rust-toolchain.toml pins 1.89.0, so a bare `cargo` is stable.
        # cargo-fuzz passes -Z, which stable rejects. AW_NIGHTLY is the
        # dated channel in .github/rust-nightly-channel (#560).
        run: cargo +$AW_NIGHTLY fuzz run ${{ matrix.target }} -- -max_total_time=120
