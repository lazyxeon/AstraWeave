# Nightly parser fuzzing. Not on pull requests.
# The matrix is every [[bin]] in a fuzz/Cargo.toml (scripts/ci/fuzz_targets.py).
# Each target is capped at 120 seconds. Corpora are restored and saved so
# coverage compounds across nights. Crash reproducers are uploaded.

name: Fuzz nightly

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targets:
    name: List fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: List cargo-fuzz bins
        id: list
        run: |
          {
            echo "matrix<<EOF"
            python3 scripts/ci/fuzz_targets.py
            echo EOF
          } >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Cache save is the only step that writes. The list job stays read-only.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targets.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: fuzz-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/fuzz/Cargo.toml') }}
          restore-keys: |
            fuzz-registry-${{ runner.os }}-

      - name: Cache cargo-fuzz
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.1-${{ runner.os }}

      - name: Install cargo-fuzz
        # rust-toolchain.toml pins 1.89.0, so a bare `cargo` is stable.
        # cargo-fuzz 0.13.1 does not build on current nightly (rustix).
        run: |
          if ! command -v cargo-fuzz >/dev/null; then
            cargo install cargo-fuzz --version 0.13.1 --locked
          fi

      - name: Restore corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.dir }}/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Prepare corpus directory
        env:
          FUZZ_DIR: ${{ matrix.dir }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: mkdir -p "$FUZZ_DIR/corpus/$FUZZ_TARGET"

      - name: Fuzz for two minutes
        working-directory: ${{ matrix.dir }}
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        # cargo-fuzz passes -Z, which stable rejects.
        run: cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time=120

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ matrix.dir }}/artifacts/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Save corpus
        if: always() && !cancelled()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.dir }}/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
