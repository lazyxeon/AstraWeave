name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run at midnight every Sunday
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Per pull-request ref. Another PR does not cancel this run. The cancelled
# jobs on #438 were the 20-minute timeout during rust-ci-setup, not this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Cargo Deny Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install cargo-deny
        run: bash .github/scripts/install-prebuilt-cargo-tool.sh cargo-deny

      - name: Run cargo-deny checks
        run: |
          echo "Running cargo-deny security checks..."
          set -e  # Exit on first error
          
          # Run bans check (detects duplicate crate versions and banned crates)
          echo "::group::Checking for banned crates and duplicate versions"
          cargo deny check bans
          echo "::endgroup::"
          
          # Run sources check (validates crate registry sources)
          echo "::group::Checking crate sources"
          cargo deny check sources
          echo "::endgroup::"
          
          echo "::group::Checking for security advisories"
          cargo deny check advisories
          echo "::endgroup::"

          echo "::group::Checking license compliance"
          cargo deny check licenses
          echo "::endgroup::"

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install cargo-audit
        run: bash .github/scripts/install-prebuilt-cargo-tool.sh cargo-audit

      - name: Run cargo-audit
        run: cargo audit