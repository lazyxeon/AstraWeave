name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run at midnight every Sunday
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/security-audit.yml'
      - 'deny.toml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'

jobs:
  cargo-deny:
    name: Cargo Deny Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.20.2
          restore-keys: ${{ runner.os }}-cargo-deny-

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny &> /dev/null || ! cargo deny --version | grep -q '0.20.2'; then
            cargo install cargo-deny --locked --version 0.20.2
          fi

      - name: Run cargo-deny checks
        run: |
          echo "Running cargo-deny security checks..."
          set -e  # Exit on first error
          
          # Run bans check (detects duplicate crate versions and banned crates)
          echo "::group::Checking for banned crates and duplicate versions"
          cargo deny check bans
          echo "::endgroup::"
          
          # Run sources check (validates crate registry sources)
          echo "::group::Checking crate sources"
          cargo deny check sources
          echo "::endgroup::"
          
          echo "::group::Checking for security advisories"
          cargo deny check advisories
          echo "::endgroup::"

          echo "::group::Checking license compliance"
          cargo deny check licenses
          echo "::endgroup::"

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2
          restore-keys: ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit &> /dev/null || ! cargo audit --version | grep -q '0.22.2'; then
            cargo install cargo-audit --locked --version 0.22.2
          fi

      - name: Run cargo-audit
        run: cargo audit