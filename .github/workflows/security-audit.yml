name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0' # Run at midnight every Sunday
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Per pull-request ref. Another PR does not cancel this run. The cancelled
# jobs on #438 were the 20-minute timeout during rust-ci-setup, not this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Cargo Deny Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        run: bash .github/scripts/install-prebuilt-cargo-tool.sh cargo-deny

      - name: Run cargo-deny checks
        run: bash scripts/ci/scan_cargo_locks.sh deny

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: bash .github/scripts/install-prebuilt-cargo-tool.sh cargo-audit

      - name: Run cargo-audit
        run: bash scripts/ci/scan_cargo_locks.sh audit
