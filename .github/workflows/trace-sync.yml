name: Trace Sync

# Drift gate for the architecture-trace registry/map. Trace front-matter is the
# source of truth; this fails if the CLAUDE.md trace table or workspace_map.html
# trace links are out of sync with it. Fix locally with:
#   cargo run -p aw_trace_sync -- --write
# Design: docs/architecture/_meta/TRACE_SYNC_PROPOSAL.md

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/architecture/**'
      - '**/Cargo.toml'
      - 'CLAUDE.md'
      - 'tools/aw_trace_sync/**'
      - '.github/workflows/trace-sync.yml'
  pull_request:
    paths:
      - 'docs/architecture/**'
      - '**/Cargo.toml'
      - 'CLAUDE.md'
      - 'tools/aw_trace_sync/**'
      - '.github/workflows/trace-sync.yml'
  workflow_dispatch:

# Shared with the other short checks that are not on the CI critical path.
# One of them holds a runner per ref. cancel-in-progress is false so a
# sibling workflow in this group is not cancelled. A newer push waits.
concurrency:
  group: fast-side-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: trace registry/map in sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup

      - name: Validate front-matter and report untraced subsystems
        run: cargo run -p aw_trace_sync -- --validate-only --list-untraced

      - name: Check registry/map are in sync with trace front-matter
        run: cargo run -p aw_trace_sync -- --check
