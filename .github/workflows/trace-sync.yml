name: Trace Sync

# Drift gate for the architecture-trace registry/map. Trace front-matter and
# cargo metadata are the sources; this fails if the CLAUDE.md trace table,
# workspace_map.html trace links, nodes, normal path edges, examples aggregate,
# footer, trace-section anchors, or crate src line counts are out of sync. Fix locally with:
#   cargo run -p aw_trace_sync -- --write
# Design: docs/architecture/_meta/TRACE_SYNC_PROPOSAL.md

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/architecture/**'
      - '**/Cargo.toml'
      - '**/src/**/*.rs'
      - 'CLAUDE.md'
      - 'tools/aw_trace_sync/**'
      - '.github/workflows/trace-sync.yml'
  pull_request:
    paths:
      - 'docs/architecture/**'
      - '**/Cargo.toml'
      - '**/src/**/*.rs'
      - 'CLAUDE.md'
      - 'tools/aw_trace_sync/**'
      - '.github/workflows/trace-sync.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: trace registry/map in sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup

      - name: Validate front-matter and report untraced subsystems
        run: cargo run -p aw_trace_sync -- --validate-only --list-untraced

      - name: Check registry/map are in sync with trace front-matter
        run: cargo run -p aw_trace_sync -- --check

      - name: Test aw_trace_sync
        run: cargo test -p aw_trace_sync
