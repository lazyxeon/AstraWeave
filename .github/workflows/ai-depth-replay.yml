name: AI depth replay hash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  hash:
    name: ai_depth_tick (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Baseline CPU
        shell: bash
        run: |
          # x86_64 pins the generic baseline. Apple Silicon keeps the
          # default aarch64 baseline (no target-cpu=native, no apple-a14).
          if [ "$(uname -m)" = "x86_64" ]; then
            echo "RUSTFLAGS=-C target-cpu=x86-64" >> "$GITHUB_ENV"
          else
            echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Replay hash
        run: cargo test -p astraweave-dialogue --test ai_depth_replay_hash -- --nocapture

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ai-depth-replay-${{ runner.os }}
          path: target/replay-hash.json
          if-no-files-found: error

  compare:
    name: compare ai_depth_tick
    needs: hash
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: ai-depth-replay-*
          merge-multiple: false
          path: replay

      - name: Fail if any OS digest differs
        shell: bash
        run: |
          python3 - << 'PY'
          import json, pathlib, sys
          root = pathlib.Path("replay")
          files = sorted(root.glob("*/replay-hash.json"))
          if len(files) < 3:
              files = sorted(root.rglob("replay-hash.json"))
          print("found", [str(p) for p in files])
          if len(files) != 3:
              sys.exit(f"expected 3 replay-hash.json files, found {len(files)}")
          required = "ai_depth_tick"
          digests = {}
          for path in files:
              rows = json.loads(path.read_text())
              by_case = {row["case"]: row["sha256"] for row in rows}
              if required not in by_case:
                  sys.exit(f"{path} missing required case {required}")
              digests[str(path)] = by_case[required]
          unique = set(digests.values())
          for path, digest in digests.items():
              print(f"{path}: {digest}")
          if len(unique) != 1:
              sys.exit("ai_depth_tick digest differs across OS")
          print("ai_depth_tick matches across OS")
          PY
