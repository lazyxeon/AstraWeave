# AstraWeave Kani Formal Verification Workflow
# Runs Kani model checker on critical crates to formally verify correctness properties
# Schedule: Weekly (Sunday 3 AM UTC)
#
# Kani verifies:
# - Memory safety with exhaustive symbolic analysis
# - Mathematical properties (e.g., commutative operations)
# - Buffer overflow protection in FFI code
# - Algorithmic correctness (e.g., data structure invariants)
#
# Unlike testing, Kani PROVES properties hold for ALL possible inputs.

name: Kani Formal Verification

on:
  schedule:
    # Run weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      crates:
        description: 'Comma-separated list of crates to verify'
        required: false
        default: 'astraweave-ecs,astraweave-math,astraweave-sdk,astraweave-core'
      timeout:
        description: 'Timeout per harness in seconds (60, 120, 300, 600, or 900)'
        required: false
        type: number
        default: 300

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  kani-ecs:
    name: Kani - astraweave-ecs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Resolve harness timeout
        id: timeout
        env:
          KANI_TIMEOUT_INPUT: ${{ github.event.inputs.timeout }}
        run: |
          raw="${KANI_TIMEOUT_INPUT:-300}"
          if [ "$raw" = "null" ]; then
            raw=300
          fi
          case "$raw" in
            60|120|300|600|900) ;;
            *)
              echo "harness timeout must be 60, 120, 300, 600, or 900" >&2
              exit 1
              ;;
          esac
          echo "value=$raw" >> "$GITHUB_OUTPUT"

      - name: Kani Verification
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: 0.68.0
          command: cargo-kani
          working-directory: .
          args: --package astraweave-ecs -Z unstable-options --harness-timeout ${{ steps.timeout.outputs.value }}
      
      - name: Upload Kani Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kani-report-ecs
          path: target/kani/
          retention-days: 30

  kani-math:
    name: Kani - astraweave-math
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve harness timeout
        id: timeout
        env:
          KANI_TIMEOUT_INPUT: ${{ github.event.inputs.timeout }}
        run: |
          raw="${KANI_TIMEOUT_INPUT:-300}"
          if [ "$raw" = "null" ]; then
            raw=300
          fi
          case "$raw" in
            60|120|300|600|900) ;;
            *)
              echo "harness timeout must be 60, 120, 300, 600, or 900" >&2
              exit 1
              ;;
          esac
          echo "value=$raw" >> "$GITHUB_OUTPUT"

      - name: Kani Verification
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: 0.68.0
          command: cargo-kani
          working-directory: .
          args: --package astraweave-math -Z unstable-options --harness-timeout ${{ steps.timeout.outputs.value }}
      
      - name: Upload Kani Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kani-report-math
          path: target/kani/
          retention-days: 30

  kani-sdk:
    name: Kani - astraweave-sdk
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve harness timeout
        id: timeout
        env:
          KANI_TIMEOUT_INPUT: ${{ github.event.inputs.timeout }}
        run: |
          raw="${KANI_TIMEOUT_INPUT:-300}"
          if [ "$raw" = "null" ]; then
            raw=300
          fi
          case "$raw" in
            60|120|300|600|900) ;;
            *)
              echo "harness timeout must be 60, 120, 300, 600, or 900" >&2
              exit 1
              ;;
          esac
          echo "value=$raw" >> "$GITHUB_OUTPUT"

      - name: Kani Verification
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: 0.68.0
          command: cargo-kani
          working-directory: .
          args: --package astraweave-sdk -Z unstable-options --harness-timeout ${{ steps.timeout.outputs.value }}
      
      - name: Upload Kani Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kani-report-sdk
          path: target/kani/
          retention-days: 30

  kani-core:
    name: Kani - astraweave-core
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Resolve harness timeout
        id: timeout
        env:
          KANI_TIMEOUT_INPUT: ${{ github.event.inputs.timeout }}
        run: |
          raw="${KANI_TIMEOUT_INPUT:-300}"
          if [ "$raw" = "null" ]; then
            raw=300
          fi
          case "$raw" in
            60|120|300|600|900) ;;
            *)
              echo "harness timeout must be 60, 120, 300, 600, or 900" >&2
              exit 1
              ;;
          esac
          echo "value=$raw" >> "$GITHUB_OUTPUT"

      - name: Kani Verification
        uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: 0.68.0
          command: cargo-kani
          working-directory: .
          args: --package astraweave-core -Z unstable-options --harness-timeout ${{ steps.timeout.outputs.value }}
      
      - name: Upload Kani Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kani-report-core
          path: target/kani/
          retention-days: 30

  summary:
    name: Kani Summary
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [kani-ecs, kani-math, kani-sdk, kani-core]
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## Kani Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| astraweave-ecs | ${{ needs.kani-ecs.result == 'success' && '✅ VERIFIED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| astraweave-math | ${{ needs.kani-math.result == 'success' && '✅ VERIFIED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| astraweave-sdk | ${{ needs.kani-sdk.result == 'success' && '✅ VERIFIED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| astraweave-core | ${{ needs.kani-core.result == 'success' && '✅ VERIFIED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Kani** provides formal mathematical proofs of correctness, not just testing." >> $GITHUB_STEP_SUMMARY
          
      - name: Fail if any verification failed
        if: ${{ needs.kani-ecs.result != 'success' || needs.kani-math.result != 'success' || needs.kani-sdk.result != 'success' || needs.kani-core.result != 'success' }}
        run: exit 1
