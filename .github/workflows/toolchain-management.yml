name: Rust Toolchain Management

on:
  push:
    branches: [ main ]
  schedule:
    # Six toolchains, nightly. MSRV stays on pull requests inside ci.yml.
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      toolchain_version:
        description: 'Rust toolchain version to test'
        required: false
        default: 'stable'
        type: string
      test_mode:
        description: 'Testing mode'
        required: true
        default: 'compatibility'
        type: choice
        options:
          - compatibility
          - performance
          - nightly-features

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  # Consistent exclusion list for problematic crates
  EXCLUDED_PACKAGES: "--exclude astraweave-author --exclude visual_3d --exclude ui_controls_demo --exclude npc_town_demo --exclude rhai_authoring --exclude cutscene_render_demo --exclude weaving_playground --exclude combat_physics_demo --exclude navmesh_demo --exclude physics_demo3d --exclude debug_toolkit_demo --exclude aw_debug --exclude aw_editor --exclude aw_asset_cli"

jobs:
  toolchain-validation:
    name: Toolchain Validation (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: 
          - stable
          - "1.89.0"  # Pinned version
          - "1.88.0"  # Previous stable for compatibility
          - beta
        include:
          # Dated nightly from .github/rust-nightly-channel (#560).
          # The label is not a rustup channel; the step below installs the pin.
          - os: ubuntu-latest
            toolchain: pinned-nightly
            experimental: true
        exclude:
          # Skip beta/older versions on Windows/macOS to reduce CI time and cost
          - os: windows-latest
            toolchain: beta
          - os: windows-latest  
            toolchain: "1.88.0"
          - os: macos-latest
            toolchain: "1.88.0"
          - os: macos-latest
            toolchain: beta

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # #205 stores the CC0 Aravath models in Git LFS and records each
          # blob's sha256 in ASSET_MANIFEST.tsv. Without LFS the working
          # tree is the pointer, so asset_manifest_is_sorted_and_hashes_match
          # hashes that pointer instead of AnimationLibrary_Godot_Standard.bin.
          lfs: true

      - name: Set up pinned nightly
        if: matrix.experimental
        uses: ./.github/actions/rust-nightly
        with:
          components: rustfmt, clippy, rust-src, rust-analyzer

      - name: Set up Rust toolchain
        if: ${{ !matrix.experimental }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ github.event.inputs.toolchain_version || matrix.toolchain }}
          components: rustfmt, clippy, rust-src, rust-analyzer

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake ninja-build \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libasound2-dev libudev-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config cmake

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Validate toolchain configuration
        run: |
          echo "=== Rust Toolchain Information ==="
          rustc --version
          cargo --version
          rustup show
          
          echo "=== Cargo Configuration ==="
          cat .cargo/config.toml
          
          echo "=== Toolchain Configuration ==="
          cat rust-toolchain.toml

      - name: Set up toolchain-specific cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-astraweave
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check workspace compatibility
        run: |
          # Test basic compilation with this toolchain
          cargo check --locked --workspace ${{ env.EXCLUDED_PACKAGES }}

      - name: macOS runners have no wgpu software adapter
        if: matrix.os == 'macos-latest'
        run: echo "AW_GPU_SKIP_IF_UNAVAILABLE=1" >> "$GITHUB_ENV"

      - name: Run minimal test suite (Linux)
        if: runner.os == 'Linux'
        run: |
          # astraweave-render's Linux tests set RUST_TEST_THREADS=1 in
          # .init_array (serialize_lib_tests.rs). libvulkan 1.4.341 SIGSEGVs
          # in vkSetDebugUtilsObjectNameEXT when several threads load every
          # Mesa ICD (Vulkan-Loader #1863). Tag v1.4.344 does not contain
          # the fix; v1.4.345 does. Do not drop that default until the
          # runner's libvulkan1 is new enough (#434).
          # aw_headless also builds InstanceDescriptor::default() and forbids
          # unsafe, so it cannot include that constructor. Its lib tests run
          # below with RUST_TEST_THREADS=1. aw_editor is in EXCLUDED_PACKAGES;
          # editor-ci.yml still runs its tests with continue-on-error, so this
          # hook is not workspace-wide.
          # runner.os, not `uname`: windows-latest runs this file under
          # PowerShell, which does not evaluate a bash `if`.
          cargo test --locked --workspace --lib ${{ env.EXCLUDED_PACKAGES }} --exclude aw_headless
          RUST_TEST_THREADS=1 cargo test --locked -p aw_headless --lib

      - name: Run minimal test suite
        if: runner.os != 'Linux'
        run: cargo test --locked --workspace --lib ${{ env.EXCLUDED_PACKAGES }}

      - name: Report GPU skips
        if: always()
        shell: bash
        run: |
          log="target/gpu-skip-reasons.txt"
          if [ -s "$log" ]; then
            {
              echo "## GPU tests skipped"
              echo
              echo "These tests did not execute. A line here is a skip, not a pass."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "- ${line}" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=GPU test skipped::$line"
              echo "$line"
            done < "$log"
          fi

      - name: Check code formatting compatibility
        # The pinned-nightly row sets experimental. Nightly rustfmt can differ.
        if: ${{ !matrix.experimental }}
        shell: bash
        run: bash .github/scripts/fmt-check.sh

      - name: Run clippy with toolchain
        run: |
          cargo clippy --locked --workspace ${{ env.EXCLUDED_PACKAGES }} -- -D warnings

      - name: Test nightly features (if nightly)
        if: matrix.experimental
        run: |
          # Test unstable features that might be beneficial
          echo 'Testing nightly-specific features...'
          # Add any nightly feature tests here
          cargo check --all-features || true

  msrv-check:
    name: Minimum Supported Rust Version Check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install MSRV from Cargo.toml
        run: |
          # Extract MSRV if specified in Cargo.toml
          if grep -q "rust-version" Cargo.toml; then
            MSRV=$(grep "rust-version" Cargo.toml | cut -d'"' -f2)
          else
            # Use toolchain version as fallback
            MSRV=$(grep "channel" rust-toolchain.toml | cut -d'"' -f2)
          fi
          echo "MSRV=$MSRV" >> $GITHUB_ENV
          echo "Detected MSRV: $MSRV"

      - name: Set up MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake ninja-build \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libasound2-dev libudev-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools

      - name: Set up MSRV cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-astraweave
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check MSRV compatibility
        run: |
          cargo check --locked --workspace ${{ env.EXCLUDED_PACKAGES }}

  performance-benchmarking:
    name: Toolchain Performance Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.test_mode == 'performance' || github.event_name == 'push'
    
    strategy:
      matrix:
        toolchain: [stable, "1.89.0", beta]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake ninja-build \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libasound2-dev libudev-dev \
            mesa-vulkan-drivers libvulkan1 vulkan-tools time

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Set up performance cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-astraweave
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Benchmark compilation time
        run: |
          echo "=== Compilation Performance for ${{ matrix.toolchain }} ===" > perf-${{ matrix.toolchain }}.txt
          echo "" >> perf-${{ matrix.toolchain }}.txt
          
          # Clean build timing
          cargo clean
          echo "Clean build:" >> perf-${{ matrix.toolchain }}.txt
          /usr/bin/time -f "Real: %E, User: %U, System: %S, Memory: %M KB" \
            cargo build --release \
              -p astraweave-core \
              -p astraweave-ai \
              -p astraweave-physics \
              -p hello_companion 2>&1 | tail -1 >> perf-${{ matrix.toolchain }}.txt
          
          # Incremental build timing
          echo "Incremental build:" >> perf-${{ matrix.toolchain }}.txt
          /usr/bin/time -f "Real: %E, User: %U, System: %S, Memory: %M KB" \
            cargo build --release \
              -p astraweave-core \
              -p astraweave-ai \
              -p astraweave-physics \
              -p hello_companion 2>&1 | tail -1 >> perf-${{ matrix.toolchain }}.txt

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.toolchain }}
          path: perf-${{ matrix.toolchain }}.txt
          retention-days: 30

  toolchain-report:
    name: Generate Toolchain Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [toolchain-validation, msrv-check]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate toolchain compatibility report
        run: |
          echo "# Rust Toolchain Compatibility Report" > toolchain-report.md
          echo "Generated on: $(date)" >> toolchain-report.md
          echo "" >> toolchain-report.md
          
          echo "## Toolchain Configuration" >> toolchain-report.md
          echo '```toml' >> toolchain-report.md
          cat rust-toolchain.toml >> toolchain-report.md
          echo '```' >> toolchain-report.md
          echo "" >> toolchain-report.md
          
          echo "## Cargo Configuration" >> toolchain-report.md
          echo '```toml' >> toolchain-report.md
          cat .cargo/config.toml >> toolchain-report.md
          echo '```' >> toolchain-report.md
          echo "" >> toolchain-report.md
          
          echo "## Validation Results" >> toolchain-report.md
          echo "Check the individual job results for detailed compatibility information." >> toolchain-report.md
          
          echo "## Recommendations" >> toolchain-report.md
          echo "- Pin to Rust 1.89.0 for stable builds" >> toolchain-report.md
          echo "- Test with beta channel regularly" >> toolchain-report.md
          echo "- Monitor nightly for upcoming features" >> toolchain-report.md

      - name: Upload toolchain report
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-report
          path: toolchain-report.md
          retention-days: 30
