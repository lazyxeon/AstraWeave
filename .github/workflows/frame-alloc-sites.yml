name: Frame alloc sites

# Opt-in heap profile of one warm draw_into. This is not a pull-request
# check and it does not assert symbol names. The allocation floor stays in
# pbr-pipeline-ci.yml and render-device-validation.yml.
#
# Local equivalent:
#   cargo test -p astraweave-render --all-features --test frame_alloc --no-run
#   heaptrack -o target/frame-alloc-heaptrack target/debug/deps/frame_alloc-* --exact draw_into_allocates_nothing_after_warmup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frame-alloc-sites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sites:
    name: heaptrack draw_into
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      # Must be set before main. Backtrace::enabled caches the first read,
      # so a set_var inside the test cannot turn capture back off.
      RUST_LIB_BACKTRACE: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/rust-ci-setup

      - name: Install heaptrack and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y heaptrack mesa-vulkan-drivers libvulkan1 pkg-config libudev-dev

      - name: Record one draw_into frame
        env:
          WGPU_BACKEND: vulkan
        run: |
          echo "RUST_BACKTRACE=${RUST_BACKTRACE:-unset}"
          echo "RUST_LIB_BACKTRACE=${RUST_LIB_BACKTRACE:-unset}"
          cargo test -p astraweave-render --all-features --test frame_alloc --no-run
          bin=$(find target/debug/deps -type f -executable -name 'frame_alloc-*' ! -name '*.d' | head -n 1)
          test -n "$bin"
          heaptrack -o target/frame-alloc-heaptrack "$bin" --exact draw_into_allocates_nothing_after_warmup --nocapture

      - name: Upload heaptrack
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frame-alloc-heaptrack
          path: target/frame-alloc-heaptrack*
          if-no-files-found: warn
