name: OpenSSF Scorecard

"on":
  # For the best security, Scorecard should be run on a schedule
  # and on any changes to the default branch
  schedule:
    - cron: '0 2 * * 0' # Run at 2 AM UTC every Sunday
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Shared with the other short checks that are not on the CI critical path.
# One of them holds a runner per ref. cancel-in-progress is false so a
# sibling workflow in this group is not cancelled. A newer push waits.
concurrency:
  group: fast-side-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload the results to code-scanning dashboard
      security-events: write
      # Needed to publish results and get a badge
      id-token: write
      # Needed to checkout the repository
      contents: read
      # Needed for GitHub OIDC token
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the results for public repositories to enable scorecard badges
          publish_results: true

      # Upload the results as artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif