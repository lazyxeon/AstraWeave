name: Material Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'assets/materials/**'
      - 'tools/aw_asset_cli/**'
      - '.github/workflows/material-validation.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'assets/materials/**'
      - 'tools/aw_asset_cli/**'
      - '.github/workflows/material-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-materials:
    name: Validate PBR Materials
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Rust CI setup
      uses: ./.github/actions/rust-ci-setup
    
    - name: Build aw_asset_cli
      run: |
        echo "::group::Building asset CLI tool"
        cargo build -p aw_asset_cli --release
        echo "::endgroup::"
    
    - name: Validate terrain materials (grassland)
      id: validate-grassland
      run: |
        set -euo pipefail
        cargo run -p aw_asset_cli --release -- validate \
          assets/materials/terrain/grassland_demo.toml \
          --format json > validation-grassland.json

    - name: Validate terrain materials (mountain)
      id: validate-mountain
      run: |
        set -euo pipefail
        cargo run -p aw_asset_cli --release -- validate \
          assets/materials/terrain/mountain_demo.toml \
          --format json > validation-mountain.json

    - name: Validate terrain materials (desert)
      id: validate-desert
      run: |
        set -euo pipefail
        cargo run -p aw_asset_cli --release -- validate \
          assets/materials/terrain/desert_demo.toml \
          --format json > validation-desert.json

    - name: Validate all materials (directory scan)
      id: validate-all
      run: |
        set -euo pipefail
        cargo run -p aw_asset_cli --release -- validate \
          assets/materials/ \
          --format json > validation-all.json
    
    - name: Parse validation results
      id: parse-results
      run: |
        set -euo pipefail
        echo "::group::Parsing validation results"

        # JSON is a non-empty array of {passed, errors, warnings}.
        check_validation() {
          local file=$1
          local name=$2

          if [ ! -f "$file" ]; then
            echo "::error::${name}: validation report is missing"
            exit 1
          fi
          passed=$(jq -e -r 'if type == "array" and length > 0 and all(.[]; .passed == true) then "true" else "false" end' "$file")
          error_count=$(jq -e -r '[.[].errors[]] | length' "$file")
          warning_count=$(jq -e -r '[.[].warnings[]] | length' "$file")

          echo "${name}_passed=${passed}" >> "$GITHUB_OUTPUT"
          echo "${name}_errors=${error_count}" >> "$GITHUB_OUTPUT"
          echo "${name}_warnings=${warning_count}" >> "$GITHUB_OUTPUT"

          if [ "$passed" = "true" ]; then
            echo "${name}: PASS (${warning_count} warnings)"
          else
            echo "${name}: FAIL (${error_count} errors, ${warning_count} warnings)"
          fi
        }
        
        # Check all validation results
        check_validation "validation-grassland.json" "grassland"
        check_validation "validation-mountain.json" "mountain"
        check_validation "validation-desert.json" "desert"
        check_validation "validation-all.json" "all_materials"
        
        echo "::endgroup::"
    
    - name: Generate validation summary
      run: |
        set -euo pipefail
        echo "## Material Validation Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Material | Status | Errors | Warnings |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|--------|----------|" >> $GITHUB_STEP_SUMMARY
        
        # Function to add summary row
        add_summary_row() {
          local file=$1
          local name=$2

          if [ ! -f "$file" ]; then
            echo "::error::${name}: validation report is missing"
            exit 1
          fi
          passed=$(jq -e -r 'if type == "array" and length > 0 and all(.[]; .passed == true) then "true" else "false" end' "$file")
          error_count=$(jq -e -r '[.[].errors[]] | length' "$file")
          warning_count=$(jq -e -r '[.[].warnings[]] | length' "$file")

          if [ "$passed" = "true" ]; then
            status="PASS"
          else
            status="FAIL"
          fi

          echo "| ${name} | ${status} | ${error_count} | ${warning_count} |" >> "$GITHUB_STEP_SUMMARY"
        }
        
        add_summary_row "validation-grassland.json" "Grassland Demo"
        add_summary_row "validation-mountain.json" "Mountain Demo"
        add_summary_row "validation-desert.json" "Desert Demo"
        add_summary_row "validation-all.json" "All Materials"
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Details" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See artifacts below for full validation reports (JSON format)." >> $GITHUB_STEP_SUMMARY
    
    - name: Upload validation reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: material-validation-reports
        path: |
          validation-*.json
        retention-days: 30
    
    - name: Check validation status
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(validation-grassland.json validation-mountain.json validation-desert.json validation-all.json)
        if [ "${#files[@]}" -ne 4 ]; then
          echo "::error::expected 4 validation reports, found ${#files[@]}"
          exit 1
        fi
        failed=0
        for file in "${files[@]}"; do
          if ! jq -e 'type == "array" and length > 0 and all(.[]; .passed == true)' "$file" >/dev/null; then
            failed=1
            echo "::error::Validation failed: $file"
            jq -r '.[] | select(.passed != true) | .asset_path + ": " + (.errors | join("; "))' "$file"
          fi
        done
        if [ "$failed" -ne 0 ]; then
          echo "::error::Material validation failed. See artifacts for details."
          exit 1
        fi
        echo "All material validations passed."
