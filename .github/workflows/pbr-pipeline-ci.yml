name: PBR Pipeline CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'astraweave-render/**'
      - 'tools/aw_asset_cli/**'
      - 'tools/aw_editor/**'
      - 'shaders/**'
      - '.github/workflows/pbr-pipeline-ci.yml'
  schedule:
    # Not on pull_request. This compile is optional and was taking runners
    # ahead of determinism-replay and the PR Rust checks.
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Debug wgpu-core takes a snatch lock with Backtrace::capture. RUST_BACKTRACE
  # makes that capture allocate (48 per draw_into). Panic backtraces stay on.
  # Set before main. The floor tests only read this. They do not call set_var.
  RUST_LIB_BACKTRACE: "0"

jobs:
  build-pbr-components:
    name: Build PBR Components (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true  # Allow workflow to pass if editor/platform issues occur
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    
    - name: Rust CI setup
      uses: ./.github/actions/rust-ci-setup
    
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
          libasound2-dev mesa-vulkan-drivers libvulkan1 libudev-dev pkg-config
    
    - name: Check formatting
      shell: bash
      run: bash .github/scripts/fmt-check.sh
    
    - name: Build astraweave-render
      run: |
        echo "::group::Building astraweave-render"
        cargo build -p astraweave-render --release
        echo "::endgroup::"
    
    - name: Build aw_asset_cli
      run: |
        echo "::group::Building aw_asset_cli"
        cargo build -p aw_asset_cli --release
        echo "::endgroup::"
    
    - name: Build aw_editor
      continue-on-error: true  # Editor has known compilation issues
      run: |
        echo "::group::Building aw_editor"
        cargo build -p aw_editor --release || echo "Editor build failed - known issue"
        echo "::endgroup::"
    
    - name: Run clippy (render crate)
      run: |
        cargo clippy -p astraweave-render --all-features -- -D warnings
    
    - name: Run clippy (asset CLI)
      run: |
        cargo clippy -p aw_asset_cli --all-features -- -D warnings
    
    - name: Run clippy (editor)
      continue-on-error: true  # Editor has known issues
      run: |
        cargo clippy -p aw_editor --all-features -- -W clippy::all
  
  test-pbr-features:
    name: Test PBR Features
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build-pbr-components
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Rust CI setup
      uses: ./.github/actions/rust-ci-setup
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
          libasound2-dev mesa-vulkan-drivers libvulkan1 libudev-dev pkg-config
    
    - name: CountingAlloc records alloc, alloc_zeroed, and realloc
      id: quiet
      run: |
        echo "::group::alloc_trace_is_quiet"
        mkdir -p target
        set -o pipefail
        cargo test -p astraweave-ecs --features alloc-counter --color never --test alloc_trace_quiet -- --nocapture 2>&1 | tee target/alloc-trace-quiet.txt
        echo "::endgroup::"
        grep -E 'test result: ok\. [1-9][0-9]* passed' target/alloc-trace-quiet.txt

    - name: draw_into allocation floor
      id: floor
      env:
        WGPU_BACKEND: vulkan
      run: |
        echo "::group::draw_into allocation floor"
        mkdir -p target
        unset VK_ADD_DRIVER_FILES
        if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
          icd=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        elif [ -f /usr/share/vulkan/icd.d/lvp_icd.json ]; then
          icd=/usr/share/vulkan/icd.d/lvp_icd.json
        else
          echo "lavapipe ICD is not installed" >&2
          exit 1
        fi
        export VK_ICD_FILENAMES="$icd"
        export VK_DRIVER_FILES="$icd"
        echo "VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
        set -o pipefail
        # eprintln! writes adapter=llvmpipe to stderr. tee must see it.
        cargo test -p astraweave-render --all-features --color never --test frame_alloc -- --nocapture 2>&1 | tee target/frame-alloc-floor.txt
        echo "::endgroup::"
        grep -E 'adapter=llvmpipe' target/frame-alloc-floor.txt
        grep -E 'test result: ok\. [1-9][0-9]* passed' target/frame-alloc-floor.txt

    - name: streamed fallback allocation floor
      id: fallback
      env:
        WGPU_BACKEND: vulkan
      run: |
        echo "::group::streamed fallback floor"
        mkdir -p target
        unset VK_ADD_DRIVER_FILES
        if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
          icd=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        elif [ -f /usr/share/vulkan/icd.d/lvp_icd.json ]; then
          icd=/usr/share/vulkan/icd.d/lvp_icd.json
        else
          echo "lavapipe ICD is not installed" >&2
          exit 1
        fi
        export VK_ICD_FILENAMES="$icd"
        export VK_DRIVER_FILES="$icd"
        set -o pipefail
        cargo test -p astraweave-render --all-features --color never --test stream_fallback -- --nocapture 2>&1 | tee target/stream-fallback-floor.txt
        echo "::endgroup::"
        grep -E 'adapter=llvmpipe' target/stream-fallback-floor.txt
        grep -E 'test result: ok\. [1-9][0-9]* passed' target/stream-fallback-floor.txt

    - name: Test astraweave-render
      id: render
      # A SIGSEGV here must fail the workflow. Do not put continue-on-error
      # back on this step or on the job: libvulkan 1.4.341 faults when
      # several threads load every Mesa ICD, and that exit used to go yellow.
      run: |
        echo "::group::Testing astraweave-render"
        cargo test -p astraweave-render --all-features -- --skip draw_into_allocates_nothing_after_warmup --skip fallback_frame_does_not_allocate_before_the_texture_is_resident --nocapture
        echo "::endgroup::"

    - name: Test terrain materials
      id: terrain
      run: |
        echo "::group::Testing terrain material system"
        mkdir -p target
        set -o pipefail
        cargo test -p astraweave-render --all-features --color never --test test_terrain_material -- --nocapture 2>&1 | tee target/terrain-material-tests.txt
        echo "::endgroup::"
        grep -E 'test result: ok\. [1-9][0-9]* passed' target/terrain-material-tests.txt
    
    - name: Test advanced materials
      id: advanced
      run: |
        echo "::group::Testing advanced PBR features"
        mkdir -p target
        set -o pipefail
        cargo test -p astraweave-render --all-features --color never --test test_pbr_advanced -- --nocapture 2>&1 | tee target/pbr-advanced-tests.txt
        echo "::endgroup::"
        grep -E 'test result: ok\. [1-9][0-9]* passed' target/pbr-advanced-tests.txt
    
    - name: Generate test summary
      if: always()
      run: |
        mark() {
          if [ "$1" = "success" ]; then
            printf '%s' "✅"
          else
            printf '%s' "❌"
          fi
        }
        {
          echo "## PBR Test Summary"
          echo
          echo "### Tested Components:"
          echo "- $(mark "${{ steps.quiet.outcome }}") CountingAlloc (alloc, alloc_zeroed, realloc)"
          echo "- $(mark "${{ steps.floor.outcome }}") draw_into allocation floor (lavapipe)"
          echo "- $(mark "${{ steps.fallback.outcome }}") streamed fallback floor (lavapipe)"
          echo "- $(mark "${{ steps.render.outcome }}") astraweave-render (core PBR)"
          echo "- $(mark "${{ steps.terrain.outcome }}") Terrain material system (Phase PBR-F)"
          echo "- $(mark "${{ steps.advanced.outcome }}") Advanced materials (Phase PBR-E)"
          echo
          echo "See job logs for detailed test results."
        } >> "$GITHUB_STEP_SUMMARY"
  
  validate-shaders:
    name: Validate WGSL Shaders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true  # wgsl-analyzer is optional
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    
    - name: Install wgsl-analyzer
      run: |
        cargo install --locked wgsl-analyzer || echo "wgsl-analyzer installation optional"
    
    - name: Check shader syntax
      continue-on-error: true
      run: |
        echo "::group::Validating WGSL shaders"
        for shader in shaders/*.wgsl; do
          echo "Checking: $shader"
          # Basic syntax check (file exists and not empty)
          if [ ! -s "$shader" ]; then
            echo "::error file=$shader::Shader file is empty or missing"
          fi
        done
        echo "::endgroup::"
    
    - name: List shader files
      run: |
        echo "## 📜 WGSL Shaders" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Shader Files:" >> $GITHUB_STEP_SUMMARY
        for shader in shaders/*.wgsl; do
          lines=$(wc -l < "$shader" 2>/dev/null || echo "?")
          echo "- \`$(basename $shader)\` (${lines} lines)" >> $GITHUB_STEP_SUMMARY
        done
