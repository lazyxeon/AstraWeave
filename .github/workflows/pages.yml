name: Pages

# The repository Pages source is GitHub Actions. Each deployment replaces the
# site, so this workflow builds every public path into one directory:
# the mdBook, rustdoc under /api/, the workspace map at /architecture/,
# and the benchmark dashboard at /dashboard/benchmark_dashboard/ with
# docs/archive/benchmark_data/ and .github/benchmark_thresholds.json.

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.rs'
      - '**/*.md'
      - 'docs/**'
      - 'docs/archive/benchmark_dashboard/**'
      - '.github/benchmark_thresholds.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.github/actions/rust-ci-setup/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.rs'
      - '**/*.md'
      - 'docs/**'
      - 'docs/archive/benchmark_dashboard/**'
      - '.github/benchmark_thresholds.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.github/actions/rust-ci-setup/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      rebuild_reason:
        description: 'Optional note for why the Pages site is being rebuilt manually'
        required: false
        type: string
      skip_link_check:
        description: 'Skip the broken-link check for a faster manual rebuild'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MDBOOK_VERSION: '0.5.2'
  MDBOOK_SHA256: '084e4342ba564db270108763e404a7d1f309d932651a22484e93c0dc1a071f6d'
  MDBOOK_MERMAID_VERSION: '0.17.0'
  MDBOOK_MERMAID_SHA256: '8aced70d781830fb0e81988f081c4abdd49e056a001ae2f1e4d484e1f6385c57'
  LYCHEE_VERSION: '0.15.1'
  LYCHEE_SHA256: '9afdf0f48064fdcd8a8815ca6d2d9fcd43a0ef4c2edf9da23d6f7bf46a764eb8'

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          curl -fsSL -o "$tmpdir/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  $tmpdir/mdbook.tar.gz" | sha256sum -c -
          tar -xzf "$tmpdir/mdbook.tar.gz" -C "$tmpdir"
          sudo install -m 0755 "$tmpdir/mdbook" /usr/local/bin/mdbook
          curl -fsSL -o "$tmpdir/mermaid.tar.gz" \
            "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_MERMAID_SHA256}  $tmpdir/mermaid.tar.gz" | sha256sum -c -
          tar -xzf "$tmpdir/mermaid.tar.gz" -C "$tmpdir"
          sudo install -m 0755 "$tmpdir/mdbook-mermaid" /usr/local/bin/mdbook-mermaid
          rm -rf "$tmpdir"
          mdbook --version
          mdbook-mermaid --version

      - name: Build the site
        run: |
          set -euo pipefail
          mdbook build docs
          # v5 omits dotfiles unless include-hidden-files is true. Actions Pages does not run Jekyll.
          touch docs/book/.nojekyll
          cp docs/src/robots.txt docs/book/robots.txt
          mkdir -p docs/book/assets
          cp -a docs/src/assets/. docs/book/assets/
          mkdir -p docs/book/architecture
          cp docs/architecture/workspace_map.html docs/book/architecture/index.html
          dest=docs/book/dashboard/benchmark_dashboard
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -a docs/archive/benchmark_dashboard/. "$dest/"
          data=docs/book/dashboard/benchmark_data
          rm -rf "$data"
          mkdir -p "$data"
          cp -a docs/archive/benchmark_data/. "$data/"
          mkdir -p docs/book/.github
          cp .github/benchmark_thresholds.json docs/book/.github/benchmark_thresholds.json

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          toolchain: "1.89.0"

      - name: Build API documentation
        run: |
          set -euo pipefail
          cargo doc --no-deps \
            --package astraweave-core \
            --package astraweave-ai \
            --package astraweave-physics \
            --package astraweave-nav \
            --package astraweave-render \
            --package astraweave-ecs \
            --package astraweave-behavior \
            --package astraweave-llm \
            --package astraweave-gameplay \
            --package astraweave-terrain
          echo '<meta http-equiv="refresh" content="0; url=astraweave_core/index.html">' > target/doc/index.html
          mkdir -p docs/book/api
          cp -a target/doc/. docs/book/api/
          echo '<meta http-equiv="refresh" content="0; url=astraweave_core/index.html">' > docs/book/api/index.html
          test -f docs/book/api/astraweave_core/index.html

      - name: Generate sitemap
        run: |
          set -euo pipefail
          bash docs/scripts/generate-sitemap.sh docs/book
          test -f docs/book/sitemap.xml

      - name: Check for broken links
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_link_check) }}
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/v${LYCHEE_VERSION}/lychee-v${LYCHEE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  /tmp/lychee.tar.gz" | sha256sum -c -
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          set +e
          /tmp/lychee docs/book \
            --exclude localhost \
            --exclude 127.0.0.1 \
            --exclude "file://" \
            --format markdown \
            --output link-report.md
          status=$?
          set -e
          if [ -f link-report.md ]; then
            {
              echo "### Link Check Report"
              echo ""
              cat link-report.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Verify the site
        run: |
          set -euo pipefail
          test -f docs/book/index.html
          test -f docs/book/robots.txt
          test -f docs/book/sitemap.xml
          grep -q "AstraWeave Workspace Architecture Map" docs/book/architecture/index.html
          test -f docs/book/dashboard/benchmark_dashboard/index.html
          test -f docs/book/dashboard/benchmark_data/benchmark_history.jsonl
          test -s docs/book/dashboard/benchmark_data/benchmark_history.jsonl
          test -f docs/book/dashboard/benchmark_data/metadata.json
          test -f docs/book/.github/benchmark_thresholds.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/book/dashboard")
          meta = json.loads(
              (root / "benchmark_data/metadata.json").read_text(encoding="utf-8")
          )
          if not meta:
              raise SystemExit("metadata.json is empty")
          thresholds = json.loads(
              Path("docs/book/.github/benchmark_thresholds.json").read_text(
                  encoding="utf-8"
              )
          )
          if not isinstance(thresholds, dict):
              raise SystemExit("benchmark_thresholds.json must be a JSON object")
          history_path = root / "benchmark_data/benchmark_history.jsonl"
          parsed = 0
          for line in history_path.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line:
                  continue
              json.loads(line)
              parsed += 1
              break
          if parsed != 1:
              raise SystemExit("benchmark_history.jsonl has no JSON line")
          PY
          test -f docs/book/api/index.html
          test -f docs/book/api/astraweave_core/index.html
          echo "Pages site: $(find docs/book -name '*.html' | wc -l) HTML files"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

      - name: Upload link report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        env:
          REBUILD_REASON: ${{ inputs.rebuild_reason }}
        run: |
          set -euo pipefail
          {
            echo "### Pages site built"
            echo ""
            echo "HTML files: $(find docs/book -name '*.html' | wc -l)"
            echo ""
            echo "- Book: \`/\`"
            echo "- Workspace map: \`/architecture/\`"
            echo "- API: \`/api/\`"
            echo "- Benchmark dashboard: \`/dashboard/benchmark_dashboard/\`"
            if [ -n "$REBUILD_REASON" ]; then
              echo ""
              echo "Rebuild note: $REBUILD_REASON"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        run: |
          {
            echo "### Pages deployed"
            echo ""
            echo "**URL**: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
