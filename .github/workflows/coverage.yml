name: Code Coverage

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Workspace coverage (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libasound2-dev

      - name: Generate workspace coverage summary
        run: |
          rm -rf coverage
          mkdir -p coverage
          cargo llvm-cov --workspace --lib --summary-only --json --output-path coverage/summary.json

      - name: Generate workspace lcov
        run: cargo llvm-cov --workspace --lib --lcov --output-path coverage/workspace.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/workspace.lcov
          flags: workspace
          name: workspace-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          summary_path = pathlib.Path("coverage/summary.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Workspace coverage (non-blocking)\n\n")
              if not summary_path.exists():
                  fh.write("Coverage summary JSON was not generated.\n")
                  sys.exit(0)
              data = json.loads(summary_path.read_text())
              totals = data["data"][0]["totals"]
              for metric in ("lines", "functions", "regions"):
                  entry = totals[metric]
                  pct = (entry["percent"] if "percent" in entry else
                         (entry["covered"] / entry["count"] * 100 if entry["count"] else 0.0))
                  fh.write(f"- {metric.title()}: {pct:.2f}% ({entry['covered']}/{entry['count']})\n")
          PY
