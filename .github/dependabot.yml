version: 2
updates:
  # Enable version updates for Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Limit the number of open pull requests for dependencies
    open-pull-requests-limit: 10
    # Group all updates together
    groups:
      dependencies:
        patterns:
          - "*"
    # Specify labels for pull requests
    labels:
      - "dependencies"
      - "security"
    # Raise pull requests for version updates against the default branch
    target-branch: "main"
    # Set a prefix for commit messages
    commit-message:
      prefix: "deps"
      include: "scope"
    # Ignore specific dependencies
    ignore:
      # Ignore patch updates for wgpu as they might break compatibility
      - dependency-name: "wgpu"
        update-types: ["version-update:semver-patch"]
      # https://github.com/lazyxeon/AstraWeave/issues/787 — exit: Andrew approves an MSRV/toolchain bump to >=1.91 and it lands.
      - dependency-name: "notify"
        versions: [">=9.0.0"]
      # https://github.com/lazyxeon/AstraWeave/issues/787 — exit: Andrew approves an MSRV/toolchain bump to >=1.95 and it lands.
      - dependency-name: "parking_lot"
        versions: [">=0.13.0"]
      # https://github.com/lazyxeon/AstraWeave/issues/787 — exit: (1) migrate tools/aw_trace_sync/src/main.rs:209 to PackageName (E0308 from 0.20.0), then narrow this floor to >=0.22.0 so 0.20.0 and 0.21.0 flow; and (2) toolchain >=1.91, or the bump lands with cargo-platform held below 0.3.3. "held below 0.3.3" means a committed Cargo.lock pin or manifest constraint on cargo-platform, on a cargo_metadata that typechecks. Narrowing the ignore floor to >=0.22.0 is not the alternative to that hold: 0.20.0 and 0.21.0 lock cargo-platform 0.2.0 (rust-version 1.81) and still fail the E0308, so this floor stays >=0.20.0 until the migration, and 0.22.0 is the first release on cargo-platform ^0.3.0. From the committed lock (cargo_metadata 0.18.1, cargo-platform 0.1.9), Dependabot's cargo update -p cargo_metadata selects cargo-platform 0.3.3 (rust-version 1.91), per #783 Trace Sync run 45859134071.
      - dependency-name: "cargo_metadata"
        versions: [">=0.20.0"]
      # https://github.com/lazyxeon/AstraWeave/issues/787 — exit: the vendor patch covers releases in >=0.9, <0.11.1 with workspace zip 9.7.0, or those releases no longer resolve zip 7 (0.9 and 0.10) or zip ^8.6.0 (0.11.0). 0.11.1 resolves zip ^9.1.3 and is not in this range.
      - dependency-name: "candle-core"
        versions: [">=0.9, <0.11.1"]
      # https://github.com/lazyxeon/AstraWeave/issues/787 — exit: the vendor patch covers releases in >=0.9, <0.11.1 with workspace zip 9.7.0, or those releases no longer resolve zip 7 (0.9 and 0.10) or zip ^8.6.0 (0.11.0). 0.11.1 resolves zip ^9.1.3 and is not in this range.
      - dependency-name: "candle-nn"
        versions: [">=0.9, <0.11.1"]
      # https://github.com/lazyxeon/AstraWeave/issues/787 — exit: the vendor patch covers releases in >=0.9, <0.11.1 with workspace zip 9.7.0, or those releases no longer resolve zip 7 (0.9 and 0.10) or zip ^8.6.0 (0.11.0). 0.11.1 resolves zip ^9.1.3 and is not in this range.
      - dependency-name: "candle-transformers"
        versions: [">=0.9, <0.11.1"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
        group-by: dependency-name
    labels:
      - "dependencies"
      - "ci"