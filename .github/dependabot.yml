version: 2
updates:
  # Enable version updates for Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Limit the number of open pull requests for dependencies
    open-pull-requests-limit: 10
    # Group all updates together
    groups:
      dependencies:
        patterns:
          - "*"
    # Specify labels for pull requests
    labels:
      - "dependencies"
      - "security"
    # Raise pull requests for version updates against the default branch
    target-branch: "main"
    # Set a prefix for commit messages
    commit-message:
      prefix: "deps"
      include: "scope"
    # Ignore specific dependencies
    ignore:
      # Ignore patch updates for wgpu as they might break compatibility
      - dependency-name: "wgpu"
        update-types: ["version-update:semver-patch"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
        group-by: dependency-name
    labels:
      - "dependencies"
      - "ci"
    # v0.0.10+ hard-fails toolchain jobs on flaky sccache v0.19.0 release downloads (#721).
    ignore:
      - dependency-name: "mozilla-actions/sccache-action"
        versions: [">=0.0.10"]