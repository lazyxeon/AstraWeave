name: Rust CI setup
description: >-
  Install the pinned Rust toolchain, host build dependencies, sccache (GitHub
  Actions cache backend), and one Swatinem rust-cache key per OS. The registry
  cache is saved only from main. Cargo target directories are not cached here;
  sccache owns compilation artifacts so the two caches do not wrap the same
  directory.

inputs:
  toolchain:
    description: Rust toolchain version
    required: false
    default: "1.89.0"
  components:
    description: Comma-separated rustup components
    required: false
    default: rustfmt,clippy
  install-nextest:
    description: Install cargo-nextest from a prebuilt binary
    required: false
    default: "false"

outputs:
  sccache-available:
    description: true when sccache v0.19.0 is on PATH for later steps
    value: ${{ steps.sccache_fetch.outputs.available }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q \
          build-essential pkg-config cmake ninja-build \
          libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
          libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-xkb-dev \
          libgl1-mesa-dev libegl1-mesa-dev wayland-protocols libwayland-dev \
          libasound2-dev libpulse-dev libudev-dev mesa-vulkan-drivers libvulkan1 vulkan-tools

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v cmake >/dev/null 2>&1 || ! command -v pkg-config >/dev/null 2>&1; then
          brew install pkg-config cmake
        fi

    - name: Fetch sccache release
      id: sccache_fetch
      shell: bash
      run: env -i PATH="$PATH" HOME="$HOME" GITHUB_OUTPUT="$GITHUB_OUTPUT" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" bash --noprofile --norc scripts/ci/fetch_sccache_release.sh

    - name: Note sccache unavailable
      if: steps.sccache_fetch.outputs.available != 'true'
      shell: bash
      run: |
        echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
        echo "::warning::sccache unavailable, building without cache"

    - name: Disable incremental compilation
      shell: bash
      run: echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

    - name: Install sccache
      if: steps.sccache_fetch.outputs.available == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0

    - name: Enable sccache
      if: steps.sccache_fetch.outputs.available == 'true'
      shell: bash
      env:
        AW_GITHUB_REF: ${{ github.ref }}
        AW_GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_CACHE_SIZE=10G" >> "$GITHUB_ENV"
        echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"
        # sccache 0.19 writes through the Actions cache. A pull request that
        # also writes hits the service rate limit (cache write errors) and
        # evicts the shared cache. Any non-pull-request run on refs/heads/main
        # (push, schedule, or manual dispatch) populates it.
        # sccache still refuses bins, cdylibs, and proc-macros.
        if [ "$AW_GITHUB_REF" = "refs/heads/main" ] && [ "$AW_GITHUB_EVENT_NAME" != "pull_request" ]; then
          echo "SCCACHE_GHA_RW_MODE=READ_WRITE" >> "$GITHUB_ENV"
        else
          echo "SCCACHE_GHA_RW_MODE=READ_ONLY" >> "$GITHUB_ENV"
        fi
        # Do not set RUSTFLAGS here. Cargo 1.89 replaces every rustflags
        # entry in .cargo/config.toml when that variable is set. The Linux
        # CPU pin lives in that file next to the Windows stack flags.

    - name: Cache cargo registry (one key per OS, save on main only)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "."
        shared-key: ${{ runner.os }}-astraweave
        cache-all-crates: "true"
        cache-targets: "false"
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      uses: taiki-e/install-action@nextest
