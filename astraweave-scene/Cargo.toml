[package]
name = "astraweave-scene"
version = "0.1.0"
edition = "2021"
license = "MIT"
autobenches = false

[dependencies]
glam = { workspace = true }
serde = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
astraweave-ecs = { path = "../astraweave-ecs" }
astraweave-asset = { path = "../astraweave-asset" }
# Explicit features, not the workspace `tokio` which enables `full` (including
# `net`). The greybox links this crate and must not pull in a network stack.
tokio = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "fs", "macros", "time"] }
wgpu = { workspace = true }

[dev-dependencies]
astraweave-render = { path = "../astraweave-render" }
serde_json.workspace = true
criterion = { workspace = true }

[features]
default = []
ecs = []
world-partition = []

# The single scene_partition_streaming binary exceeded the 600s per-target
# cap on main 0758171b. Each pair of groups gets its own target. The cap stays.
[[bench]]
name = "scene_transform"
harness = false

[[bench]]
name = "scene_grid_aabb"
harness = false

[[bench]]
name = "scene_frustum_lru"
harness = false

[[bench]]
name = "scene_partition_budget"
harness = false

[[bench]]
name = "scene_cells_queries"
harness = false
