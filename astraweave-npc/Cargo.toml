[package]
name = "astraweave-npc"
version = "0.1.0"
license.workspace = true
edition = "2021"

[[bench]]
name = "npc_adversarial"
harness = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
glam = { workspace = true }

astraweave-physics = { path = "../astraweave-physics", optional = true }
astraweave-audio = { path = "../astraweave-audio", optional = true }
# Gamepad (gilrs) enters through astraweave-gameplay → astraweave-input.
# The crate does not call it. Keep the edge opt-in so the AI tick and the
# editor do not build libudev.
astraweave-gameplay = { path = "../astraweave-gameplay", optional = true }

[features]
default = ["engine"]
engine = ["physics", "audio"]
physics = ["dep:astraweave-physics"]
audio = ["dep:astraweave-audio"]
gamepad = ["dep:astraweave-gameplay"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
astraweave-physics = { path = "../astraweave-physics" }
