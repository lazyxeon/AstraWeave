[package]
name = "astraweave-nav"
version = "0.1.0"
license.workspace = true
edition = "2021"

[dependencies]
anyhow = { workspace = true }
astraweave-destruction = { workspace = true }
glam = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "navmesh_benchmarks"
harness = false

# cargo-mutants 27.1.0 reads `cfg_attr(mutants_skip, mutants::skip)` from source.
# It does not set `cfg(mutants_skip)`. This crate no longer uses that attribute,
# so it does not list the cfg under `unexpected_cfgs`.

# P1 unwrap guidance. Warn, matching the old non-blocking P1 matrix.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
