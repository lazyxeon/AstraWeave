[package]
name = "astraweave-net"
version = "0.1.0"
license.workspace = true
edition = "2021"

[features]
default = []
tls = ["tokio-rustls", "rustls", "webpki-roots"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dangerous-testing"))'] }

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
tungstenite = { workspace = true }
tokio-tungstenite = { workspace = true }
astraweave-core = { path = "../astraweave-core" }
rand = { workspace = true }

# TLS support (optional) - using ring for Windows compatibility
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "net_bench"
harness = false

# Production-lib unwrap gate. Enforced by the single workspace clippy --lib pass.
# Tests are not part of --lib, so test unwraps stay allowed.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
result_large_err = "allow"
