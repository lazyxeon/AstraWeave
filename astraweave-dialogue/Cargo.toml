[package]
name = "astraweave-dialogue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobenches = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
astraweave-core = { path = "../astraweave-core" }
toml = { workspace = true }

# Phase 2 LLM Integration
astraweave-llm = { path = "../astraweave-llm" }
astraweave-embeddings = { path = "../astraweave-embeddings" }
astraweave-context = { path = "../astraweave-context" }
astraweave-prompts = { path = "../astraweave-prompts" }
astraweave-rag = { path = "../astraweave-rag" }
astraweave-persona = { path = "../astraweave-persona" }

# Async runtime
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"

# Additional utilities
regex = "1.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# dialogue_bench exceeded the 600s per-target cap on main 0758171b.
[[bench]]
name = "dialogue_validation"
harness = false

[[bench]]
name = "dialogue_serialize"
harness = false

[[bench]]
name = "dialogue_traverse"
harness = false
