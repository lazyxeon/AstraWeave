# cargo-audit 0.22.2 reads this file (`.cargo/audit.toml`).
# `ignore` is a list of advisory IDs. The schema has no reason field;
# the reason and tracking issue live in the comment and in `deny.toml`.
#
# Vulnerability IDs below have no upgrade that keeps the current parents.
# Unmaintained IDs have no patched release. Each one has a tracking issue.
# zip 1.1.4 is gone. third_party/candle-core is crates.io candle-core 0.8.4
# pinned to zip 9.0.3, the patched line for RUSTSEC-2026-0367, 0368, and 0369.
# Drop that directory and the [patch.crates-io] entry once candle upstream
# depends on zip >= 9. No published candle release does, through 0.11.0.
# https://github.com/lazyxeon/AstraWeave/issues/324

[advisories]
ignore = [
    # nalgebra 0.26.2 is pinned by mikktspace 0.3.0. Tangent generation
    # does not deserialize VecStorage.
    # https://github.com/lazyxeon/AstraWeave/issues/306
    "RUSTSEC-2021-0070",

    # quick-xml < 0.41 is pulled by egui-winit/accesskit and wayland-scanner.
    # Those parents do not accept 0.41.
    # https://github.com/lazyxeon/AstraWeave/issues/308
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # Unmaintained, no patched release. Same IDs as deny.toml.
    # https://github.com/lazyxeon/AstraWeave/issues/305
    "RUSTSEC-2025-0141",
    # https://github.com/lazyxeon/AstraWeave/issues/309
    "RUSTSEC-2026-0249",
    # https://github.com/lazyxeon/AstraWeave/issues/310
    "RUSTSEC-2026-0192",

    # Older unmaintained parents. No patched release.
    # https://github.com/lazyxeon/AstraWeave/issues/321
    "RUSTSEC-2025-0057",
    # https://github.com/lazyxeon/AstraWeave/issues/322
    "RUSTSEC-2024-0384",
    # https://github.com/lazyxeon/AstraWeave/issues/323
    "RUSTSEC-2024-0436",
]
