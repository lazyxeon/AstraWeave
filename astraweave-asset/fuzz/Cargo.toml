[package]
name = "astraweave-asset-fuzz"
version = "0.0.0"
license = "MIT"
publish = false
edition = "2021"
[workspace]
# This is a separate workspace to avoid conflicts with the main workspace

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dependencies.astraweave-asset]
path = ".."

[[bin]]
name = "fuzz_asset_headers"
path = "fuzz_targets/fuzz_asset_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_asset_path_resolution"
path = "fuzz_targets/fuzz_asset_path_resolution.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_asset_database"
path = "fuzz_targets/fuzz_asset_database.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_asset_manifest"
path = "fuzz_targets/fuzz_asset_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gltf_json"
path = "fuzz_targets/fuzz_gltf_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cell_ron"
path = "fuzz_targets/fuzz_cell_ron.rs"
test = false
doc = false
bench = false
